name: Observability Static Validation

on:
  pull_request:
    paths:
      - "HudhudNestApi/Observability/**"
      - "observability/**"
      - "scripts/verify-observability.sh"
      - "tests/HudhudNestApi.Observability.Tests/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x
      - run: dotnet test tests/HudhudNestApi.Observability.Tests/HudhudNestApi.Observability.Tests.csproj
      - run: jq -e . observability/grafana/dashboards/hudhudnest-production.json >/dev/null
      - run: docker compose -f observability/docker-compose.observability.yml config --quiet
      - name: Validate collector
        run: |
          docker run --rm -v "$PWD/observability/otel-collector:/config:ro" \
            otel/opentelemetry-collector-contrib:0.132.0 \
            validate --config=/config/config.yaml
      - name: Validate Prometheus and alert rules
        run: |
          docker run --rm -v "$PWD/observability/prometheus:/etc/prometheus:ro" \
            --entrypoint promtool prom/prometheus:v3.5.0 \
            check config /etc/prometheus/prometheus.yml
