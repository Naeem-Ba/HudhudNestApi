name: Database Backup

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-database-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Encrypted PostgreSQL Backup
    runs-on: ubuntu-latest
    environment: production-recovery
    timeout-minutes: 1440
    env:
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL || secrets.DATABASE_URL }}
      BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
      BACKUP_STORAGE_URI: ${{ secrets.BACKUP_STORAGE_URI }}
      AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_AWS_SECRET_ACCESS_KEY }}
      BACKUP_AWS_REGION: ${{ secrets.BACKUP_AWS_REGION }}
      BACKUP_S3_ENDPOINT_URL: ${{ secrets.BACKUP_S3_ENDPOINT_URL }}
      BACKUP_S3_KMS_KEY_ID: ${{ secrets.BACKUP_S3_KMS_KEY_ID }}
      BACKUP_S3_SSE: ${{ vars.BACKUP_S3_SSE || 'AES256' }}
      BACKUP_REQUIRE_REMOTE_UPLOAD: "true"
      APPLICATION_COMMIT_SHA: ${{ github.sha }}
      BACKUP_OUTPUT_DIR: /workspace/artifacts/database-backup
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require production backup configuration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/database-backup
          for name in DATABASE_URL BACKUP_ENCRYPTION_KEY BACKUP_STORAGE_URI AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY; do
            if [ -z "${!name:-}" ]; then
              printf '{"status":"failed","phase":"configuration","missingSecret":"%s"}\n' "${name}" \
                > artifacts/database-backup/preflight-result.json
              echo "::error::Required production recovery secret is missing: ${name}"
              exit 1
            fi
          done

      - name: Build pinned PostgreSQL 16 recovery toolbox
        run: docker build --pull --file ci/Dockerfile.database-recovery --tag propertyapi-database-recovery:local .

      - name: Create, encrypt, verify, and upload backup
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/database-backup
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env DATABASE_URL \
            --env BACKUP_ENCRYPTION_KEY \
            --env BACKUP_STORAGE_URI \
            --env AWS_ACCESS_KEY_ID \
            --env AWS_SECRET_ACCESS_KEY \
            --env BACKUP_AWS_REGION \
            --env BACKUP_S3_ENDPOINT_URL \
            --env BACKUP_S3_KMS_KEY_ID \
            --env BACKUP_S3_SSE \
            --env BACKUP_REQUIRE_REMOTE_UPLOAD \
            --env APPLICATION_COMMIT_SHA \
            --env BACKUP_OUTPUT_DIR \
            --volume "${PWD}/artifacts/database-backup:/workspace/artifacts/database-backup" \
            propertyapi-database-recovery:local \
            bash /workspace/scripts/database/backup-postgres.sh

      - name: Apply tiered retention
        shell: bash
        env:
          RETENTION_APPLY: "true"
        run: |
          set -euo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env BACKUP_STORAGE_URI \
            --env AWS_ACCESS_KEY_ID \
            --env AWS_SECRET_ACCESS_KEY \
            --env BACKUP_AWS_REGION \
            --env BACKUP_S3_ENDPOINT_URL \
            --env RETENTION_APPLY \
            propertyapi-database-recovery:local \
            bash /workspace/scripts/database/apply-retention.sh
            
      - name: DEBUG - connectivity verification (temporary, remove after diagnosis)
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_AWS_SECRET_ACCESS_KEY }}
          BACKUP_AWS_REGION: ${{ secrets.BACKUP_AWS_REGION }}
          BACKUP_S3_ENDPOINT_URL: ${{ secrets.BACKUP_S3_ENDPOINT_URL }}
          BACKUP_STORAGE_URI: ${{ secrets.BACKUP_STORAGE_URI }}
        run: |
          set -euo pipefail
          source scripts/database/common.sh
          parse_s3_uri "${BACKUP_STORAGE_URI}"
          aws_arguments

          echo "== Step 1: network reachability =="
          curl -sv --max-time 10 "${BACKUP_S3_ENDPOINT_URL:-https://s3.amazonaws.com}" 2>&1 | tail -15 || true

          echo "== Step 2: credentials check =="
          aws "${AWS_ARGS[@]}" sts get-caller-identity || echo "STS failed or unsupported — not necessarily an error for non-AWS providers"

          echo "== Step 3: bucket existence =="
          if ! aws "${AWS_ARGS[@]}" s3api head-bucket --bucket "${S3_BUCKET}" 2>"${WORK_DIR}/head-error.log"; then
            cat "${WORK_DIR}/head-error.log" >&2
            fail "Bucket '${S3_BUCKET}' does not exist or is inaccessible — refusing to proceed with retention."
          fi

          if ! aws "${AWS_ARGS[@]}" s3api list-objects-v2 \
            --bucket "${S3_BUCKET}" \
            --prefix "${S3_PREFIX:+${S3_PREFIX}/}backups/" \
            --output json > "${OBJECTS_JSON}" 2> "${WORK_DIR}/list-error.log"; then
            if grep -q "NoSuchKey" "${WORK_DIR}/list-error.log"; then
              log "Bucket confirmed to exist; treating NoSuchKey on empty prefix as no objects (known R2 behavior)."
              echo '{"Contents": []}' > "${OBJECTS_JSON}"
            else
              cat "${WORK_DIR}/list-error.log" >&2
              fail "list-objects-v2 failed."
            fi
          fi

          echo "== Step 4: prefix listing =="
          aws "${AWS_ARGS[@]}" s3api list-objects-v2 \
            --bucket "${S3_BUCKET}" \
            --prefix "${S3_PREFIX:+${S3_PREFIX}/}backups/" \
            --max-items 5 \
            --output json || echo "RESULT: list-objects-v2 failed with exit code $?"
          echo "Parsed bucket name: [${S3_BUCKET}]"
          echo "Parsed prefix: [${S3_PREFIX}]"
          
      - name: Publish non-sensitive backup evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: database-backup-evidence-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: error
          path: |
            artifacts/database-backup/*.manifest.json
            artifacts/database-backup/*result.json
            artifacts/database-backup/*verification.json

      - name: Alert on failure
        if: failure()
        shell: bash
        env:
          RECOVERY_ALERT_WEBHOOK_URL: ${{ secrets.RECOVERY_ALERT_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          if [ -n "${RECOVERY_ALERT_WEBHOOK_URL:-}" ]; then
            curl --fail --silent --show-error --request POST \
              --header 'Content-Type: application/json' \
              --data "$(jq -n --arg text "PropertyApi production database backup failed: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" '{text:$text}')" \
              "${RECOVERY_ALERT_WEBHOOK_URL}"
          fi
