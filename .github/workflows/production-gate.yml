name: Production Gate

on:
  pull_request:
    branches:
      - main
      - master
      - develop

  push:
    branches:
      - main
      - master
      - develop

  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: 8.0.x
  COMPOSE_FILE: ci/docker-compose.production-gate.yml
  HUDHUDNEST_IMAGE_TAG: production-gate

concurrency:
  group: production-gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  performance-validation:
    name: Mandatory Concurrent Performance Gate
    uses: ./.github/workflows/performance-validation.yml
    with:
      profile: ${{ github.event_name == 'pull_request' && 'pr' || 'release' }}

  build-test-container:
    name: Build, Test and Container Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    services:
      postgres_test:
        # Must match ci/postgres-version.env (production runs PostgreSQL 17 --
        # see that file's comment). scripts/database/check-postgres-version-consistency.sh
        # fails this workflow if this line ever drifts from that canonical value.
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hudhudnest_testing
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hudhudnest_testing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      redis_test:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      TEST_POSTGRES_CONNECTION_STRING: >-
        Host=127.0.0.1;Port=5432;Database=hudhudnest_testing;Username=postgres;Password=postgres
      ConnectionStrings__DefaultConnection: >-
        Host=127.0.0.1;Port=5432;Database=hudhudnest_testing;Username=postgres;Password=postgres
      ConnectionStrings__Redis: 127.0.0.1:6379,abortConnect=false
      Redis__ConnectionString: 127.0.0.1:6379,abortConnect=false
      Redis__Required: "false"
      ASPNETCORE_ENVIRONMENT: Testing
      DOTNET_ENVIRONMENT: Testing
      Database__ApplyMigrationsOnStartup: "false"
      Database__SeedOnStartup: "false"

      # Non-secret identifiers used by the test host.
      Jwt__Issuer: HudhudNest
      Jwt__Audience: HudhudNestClient

      Cloudinary__CloudName: ci
      Cloudinary__ApiKey: ci
      Cloudinary__ApiSecret: ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify Postgres/PostGIS version consistency (Finding F1)
        run: bash scripts/database/check-postgres-version-consistency.sh

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Generate ephemeral test security keys
        shell: bash
        run: |
          set -euo pipefail

          jwt_key="$(openssl rand -base64 48 | tr -d '\n')"
          otp_key="$(openssl rand -base64 48 | tr -d '\n')"
          phone_hmac_key="$(openssl rand -base64 32 | tr -d '\n')"

          echo "::add-mask::${jwt_key}"
          echo "::add-mask::${otp_key}"
          echo "::add-mask::${phone_hmac_key}"

          {
            echo "Jwt__Key=${jwt_key}"
            echo "OtpSettings__SecretKey=${otp_key}"
            echo "Security__PhoneLookupHmacKey=${phone_hmac_key}"
          } >> "${GITHUB_ENV}"

      - name: Restore dependencies
        run: dotnet restore HudhudNestApi.sln --locked-mode

      - name: Restore local .NET tools
        run: dotnet tool restore

      - name: Validate package governance
        shell: pwsh
        run: |
          ./scripts/validate-package-governance.ps1 `
            -RepositoryRoot $PWD.Path `
            -SolutionPath "HudhudNestApi.sln" `
            -PolicyPath "ci/package-policy.json" `
            -OutputDirectory "artifacts/supply-chain"

      - name: Validate GitHub Actions pinning
        run: |
          python scripts/validate-github-actions-pinning.py \
            --repository-root . \
            --output artifacts/supply-chain/action-pinning-report.json

      - name: Build solution
        run: |
          dotnet build HudhudNestApi.sln \
            --configuration Release \
            --no-restore

      - name: Verify formatting
        run: |
          dotnet format HudhudNestApi.sln \
            --verify-no-changes \
            --no-restore

      - name: Run static production gate
        shell: pwsh
        run: |
          ./scripts/verify-production-gate.ps1 `
            -RepositoryRoot $PWD.Path

      - name: Enforce migration recovery classification
        shell: bash
        run: bash scripts/database/analyze-migrations.sh

      - name: Verify test infrastructure
        run: |
          set -euo pipefail

          docker exec \
            "${{ job.services.postgres_test.id }}" \
            pg_isready \
            -U postgres \
            -d hudhudnest_testing

          redis_response="$(
            docker exec \
              "${{ job.services.redis_test.id }}" \
              redis-cli \
              ping
          )"

          if [ "${redis_response}" != "PONG" ]; then
            echo "Redis test service did not return PONG."
            exit 1
          fi

      - name: Apply integration-test database migrations
        run: |
          set -euo pipefail

          dotnet run \
            --project tools/HudhudNestApi.Migrator/HudhudNestApi.Migrator.csproj \
            --configuration Release \
            --no-build

      - name: Run architecture tests without coverage instrumentation
        run: |
          dotnet test \
            tests/HudhudNestApi.Architecture.Tests/HudhudNestApi.Architecture.Tests.csproj \
            --configuration Release \
            --no-build \
            --logger "trx;LogFileName=architecture-tests.trx"

      - name: Run application tests with coverage
        run: |
          dotnet test \
            tests/HudhudNestApi.Application.Tests/HudhudNestApi.Application.Tests.csproj \
            --configuration Release \
            --no-build \
            --collect:"XPlat Code Coverage" \
            --logger "trx;LogFileName=application-tests.trx"

      - name: Run authentication tests with coverage
        run: |
          dotnet test \
            tests/HudhudNestApi.Auth.Tests/HudhudNestApi.Auth.Tests.csproj \
            --configuration Release \
            --no-build \
            --collect:"XPlat Code Coverage" \
            --logger "trx;LogFileName=auth-tests.trx"

      - name: Run integration tests with coverage
        run: |
          dotnet test \
            tests/HudhudNestApi.Integration.Tests/HudhudNestApi.Integration.Tests.csproj \
            --configuration Release \
            --no-build \
            --collect:"XPlat Code Coverage" \
            --logger "trx;LogFileName=integration-tests.trx"

      # Infrastructure adapters (SMS providers, storage, ...) are unit-tested here, not in the three
      # suites above. Without this step the changed-code coverage check counted their tests as missing
      # (PR #210: 9% changed-line coverage although every adapter had a test).
      - name: Run infrastructure tests with coverage
        run: |
          dotnet test \
            tests/HudhudNestApi.Infrastructure.Tests/HudhudNestApi.Infrastructure.Tests.csproj \
            --configuration Release \
            --no-build \
            --collect:"XPlat Code Coverage" \
            --logger "trx;LogFileName=infrastructure-tests.trx"

      - name: Validate test result files
        shell: pwsh
        run: |
          ./scripts/validate-test-results.ps1 `
            -TestResultsRoot "." `
            -OutputDirectory "artifacts/supply-chain"

      - name: Check vulnerable packages
        shell: pwsh
        run: |
          ./ci/check-vulnerable-packages.ps1 `
            -SolutionPath "HudhudNestApi.sln" `
            -BaselinePath "ci/vulnerability-baseline.json" `
            -OutputDirectory "artifacts/vulnerability"

      - name: Check coverage baseline
        shell: pwsh
        run: |
          ./ci/check-coverage-baseline.ps1 `
            -CoverageRoot "." `
            -BaselinePath "ci/coverage-baseline.json" `
            -OutputDirectory "artifacts/coverage"

      - name: Validate staged coverage thresholds
        run: |
          python scripts/validate-coverage-thresholds.py \
            --repository-root . \
            --coverage-root . \
            --policy ci/coverage-thresholds.json \
            --output-directory artifacts/coverage

      - name: Generate coverage report
        run: |
          dotnet tool run reportgenerator -- \
            -reports:"**/coverage.cobertura.xml" \
            -targetdir:"artifacts/coverage/report" \
            -reporttypes:"HtmlInline;Cobertura;MarkdownSummaryGithub"

          if [ -f artifacts/coverage/report/SummaryGithub.md ]; then
            cat artifacts/coverage/report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Validate Docker Compose configuration
        run: |
          set -euo pipefail

          docker compose \
            -f "${COMPOSE_FILE}" \
            config \
            --quiet

      - name: Build production-like images
        run: |
          set -euo pipefail

          docker compose \
            -f "${COMPOSE_FILE}" \
            build \
            --pull \
            api \
            migrator

      - name: Capture API image digest
        id: capture-api-image
        run: |
          set -euo pipefail

          api_image_ref="hudhudnest-api:${HUDHUDNEST_IMAGE_TAG}"
          api_image_digest="$(
            docker image inspect \
              --format '{{.Id}}' \
              "${api_image_ref}"
          )"

          if [[ ! "${api_image_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Could not capture an immutable sha256 image id for ${api_image_ref}."
            exit 1
          fi

          {
            echo "image_ref=${api_image_ref}"
            echo "image_digest=${api_image_digest}"
          } >> "${GITHUB_OUTPUT}"

          {
            echo "HUDHUDNEST_IMAGE_REF=${api_image_ref}"
            echo "HUDHUDNEST_IMAGE_DIGEST=${api_image_digest}"
          } >> "${GITHUB_ENV}"

          mkdir -p artifacts/supply-chain
          jq -n \
            --arg imageRef "${api_image_ref}" \
            --arg imageDigest "${api_image_digest}" \
            --arg commitSha "${GITHUB_SHA}" \
            '{imageRef: $imageRef, imageDigest: $imageDigest, commitSha: $commitSha}' \
            > artifacts/supply-chain/image-digest.json

      - name: Generate application SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: cyclonedx
          output: artifacts/supply-chain/hudhudnest-dotnet.cdx.json
          scanners: vuln
          skip-dirs: artifacts

      - name: Generate container SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.capture-api-image.outputs.image_digest }}
          format: spdx-json
          output: artifacts/supply-chain/hudhudnest-container.spdx.json
          scanners: vuln

      - name: Scan container image as JSON
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.capture-api-image.outputs.image_digest }}
          format: json
          output: artifacts/supply-chain/container-scan.json
          scanners: vuln,secret,misconfig
          vuln-type: os,library
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: '0'

      - name: Scan container image as SARIF
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.capture-api-image.outputs.image_digest }}
          format: sarif
          output: artifacts/supply-chain/container-scan.sarif
          scanners: vuln,secret,misconfig
          vuln-type: os,library
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: '0'

      - name: Validate release security evidence
        run: |
          python scripts/generate-release-security-manifest.py \
            --repository-root . \
            --output artifacts/supply-chain/release-security-manifest.json \
            --sbom-metadata-output artifacts/supply-chain/sbom-metadata.json \
            --correlation-output artifacts/supply-chain/sbom-vulnerability-report.json \
            --summary-output artifacts/supply-chain/release-security-manifest.md \
            --container-scan-summary-output artifacts/supply-chain/container-scan-summary.md

      - name: Start PostgreSQL and Redis
        run: |
          set -euo pipefail

          docker compose \
            -f "${COMPOSE_FILE}" \
            up \
            -d \
            --wait \
            --wait-timeout 120 \
            postgres \
            redis

          docker compose \
            -f "${COMPOSE_FILE}" \
            ps

      - name: Run database migrator
        run: |
          set -euo pipefail
 
          max_attempts=5
          attempt=1
 
          until docker compose \
            -f "${COMPOSE_FILE}" \
            run \
            --rm \
            --no-deps \
            migrator; do
 
            if [ "${attempt}" -ge "${max_attempts}" ]; then
              echo "::error::Migrator failed after ${max_attempts} attempts."
              docker compose -f "${COMPOSE_FILE}" logs --no-color postgres
              exit 1
            fi
 
            echo "Migrator attempt ${attempt}/${max_attempts} failed (likely Postgres not fully ready). Retrying in 5s..."
            attempt=$((attempt + 1))
            sleep 5
          done

      - name: Verify applied migrations
        run: |
          set -euo pipefail

          migration_count="$(
            docker compose \
              -f "${COMPOSE_FILE}" \
              exec \
              -T \
              postgres \
              psql \
              -U postgres \
              -d hudhudnest_gate \
              -tAc \
              'SELECT COUNT(*) FROM "__EFMigrationsHistory";'
          )"

          migration_count="$(echo "${migration_count}" | tr -d '[:space:]')"

          echo "Applied migration count: ${migration_count}"

          if [ -z "${migration_count}" ] || [ "${migration_count}" -le 0 ]; then
            echo "No EF Core migrations were found."
            exit 1
          fi

      - name: Verify PostGIS
        run: |
          set -euo pipefail

          docker compose \
            -f "${COMPOSE_FILE}" \
            exec \
            -T \
            postgres \
            psql \
            -U postgres \
            -d hudhudnest_gate \
            -c "SELECT PostGIS_Version();"

      - name: Start API
        run: |
          set -euo pipefail

          docker compose \
            -f "${COMPOSE_FILE}" \
            up \
            -d \
            api

      - name: Wait for API liveness
        shell: bash
        run: |
          set -euo pipefail

          api_ready=false

          for attempt in $(seq 1 60); do
            echo "Liveness attempt ${attempt}/60"

            if curl \
              --fail \
              --silent \
              --show-error \
              --max-time 5 \
              http://127.0.0.1:18080/health/live \
              > /dev/null; then

              api_ready=true
              break
            fi

            sleep 2
          done

          if [ "${api_ready}" != "true" ]; then
            echo "API did not become live."

            docker compose \
              -f "${COMPOSE_FILE}" \
              logs \
              --no-color \
              api

            exit 1
          fi

      - name: Verify liveness and readiness
        run: |
          set -euo pipefail

          curl \
            --fail \
            --silent \
            --show-error \
            --max-time 10 \
            http://127.0.0.1:18080/health/live

          echo

          curl \
            --fail \
            --silent \
            --show-error \
            --max-time 10 \
            http://127.0.0.1:18080/health/ready

          echo

      - name: Assert API container is non-root
        run: |
          set -euo pipefail

          # The runtime image (mcr.microsoft.com/dotnet/aspnet:8.0-jammy-chiseled-extra)
          # is a distroless-style image: it has no shell and no coreutils, so
          # `docker compose exec api id -u` fails with "executable file not
          # found in $PATH" (exit 127). Instead, read the effective user Docker
          # actually started the container's process with, which reflects the
          # Dockerfile's `USER $APP_UID` (and any compose-level override, if
          # one is ever added) without needing to exec anything inside the
          # container.

          api_container_id="$(
            docker compose \
              -f "${COMPOSE_FILE}" \
              ps \
              -q \
              api
          )"

          if [ -z "${api_container_id}" ]; then
            echo "API container was not found."
            exit 1
          fi

          uid="$(
            docker inspect \
              --format '{{.Config.User}}' \
              "${api_container_id}"
          )"

          echo "API container configured user: ${uid}"

          if [ -z "${uid}" ] || [ "${uid}" = "0" ] || [ "${uid}" = "root" ]; then
            echo "API container is running as root."
            exit 1
          fi

      - name: Verify Data Protection key persistence
        run: |
          set -euo pipefail

          key_count="$(
            docker compose \
              -f "${COMPOSE_FILE}" \
              exec \
              -T \
              postgres \
              psql \
              -U postgres \
              -d hudhudnest_gate \
              -tAc \
              'SELECT COUNT(*) FROM "DataProtectionKeys";'
          )"

          key_count="$(echo "${key_count}" | tr -d '[:space:]')"

          echo "Data Protection key count: ${key_count}"

          if [ -z "${key_count}" ] || [ "${key_count}" -le 0 ]; then
            echo "No persisted Data Protection key was found."
            exit 1
          fi

      - name: Assert API does not use filesystem key storage
        run: |
          set -euo pipefail

          api_logs="$(
            docker compose \
              -f "${COMPOSE_FILE}" \
              logs \
              --no-color \
              api
          )"

          if echo "${api_logs}" |
            grep -E \
              'FileSystemXmlRepository|/home/app/.aspnet/DataProtection-Keys'; then

            echo "API is using ephemeral filesystem Data Protection keys."
            exit 1
          fi

          echo "Data Protection keys are not stored in the container filesystem."

      - name: Verify readiness failure when Redis is unavailable
        id: redis-outage-test
        shell: bash
        run: |
          set -euo pipefail

          echo "redis_stopped=false" >> "${GITHUB_OUTPUT}"

          redis_container_id="$(
            docker compose \
              -f "${COMPOSE_FILE}" \
              ps \
              -q \
              redis \
              2>/dev/null \
              || true
          )"

          if [ -z "${redis_container_id}" ]; then
            echo "Redis container does not exist."
            exit 1
          fi

          docker compose \
            -f "${COMPOSE_FILE}" \
            stop \
            redis

          echo "redis_stopped=true" >> "${GITHUB_OUTPUT}"

          dependency_failure_verified=false

          for attempt in $(seq 1 30); do
            live_status="$(
              curl \
                --silent \
                --output /dev/null \
                --write-out "%{http_code}" \
                --max-time 10 \
                http://127.0.0.1:18080/health/live \
                || true
            )"

            ready_status="$(
              curl \
                --silent \
                --output /dev/null \
                --write-out "%{http_code}" \
                --max-time 15 \
                http://127.0.0.1:18080/health/ready \
                || true
            )"

            echo "Dependency failure attempt ${attempt}/30"
            echo "Liveness status without Redis: ${live_status}"
            echo "Readiness status without Redis: ${ready_status}"

            if [ "${live_status}" = "200" ] && [ "${ready_status}" = "503" ]; then
              dependency_failure_verified=true
              break
            fi

            sleep 2
          done

          if [ "${dependency_failure_verified}" != "true" ]; then
            echo "Expected liveness 200 and readiness 503 after stopping Redis."
            exit 1
          fi

      - name: Restore Redis and verify readiness recovery
        if: ${{ always() && steps.redis-outage-test.outputs.redis_stopped == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          redis_container_id="$(
            docker compose \
              -f "${COMPOSE_FILE}" \
              ps \
              -a \
              -q \
              redis \
              2>/dev/null \
              || true
          )"

          api_container_id="$(
            docker compose \
              -f "${COMPOSE_FILE}" \
              ps \
              -a \
              -q \
              api \
              2>/dev/null \
              || true
          )"

          if [ -z "${redis_container_id}" ]; then
            echo "Redis container was not created."
            exit 1
          fi

          if [ -z "${api_container_id}" ]; then
            echo "API container was not created."
            exit 1
          fi

          docker compose \
            -f "${COMPOSE_FILE}" \
            start \
            redis

          redis_ready=false

          for attempt in $(seq 1 40); do
            redis_health="$(
              docker inspect \
                --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' \
                "${redis_container_id}" \
                2>/dev/null \
                || true
            )"

            echo "Redis health attempt ${attempt}/40: ${redis_health}"

            if [ "${redis_health}" = "healthy" ]; then
              redis_ready=true
              break
            fi

            sleep 2
          done

          if [ "${redis_ready}" != "true" ]; then
            echo "Redis did not recover to a healthy state."
            exit 1
          fi

          readiness_recovered=false

          for attempt in $(seq 1 30); do
            ready_status="$(
              curl \
                --silent \
                --output /dev/null \
                --write-out "%{http_code}" \
                --max-time 10 \
                http://127.0.0.1:18080/health/ready \
                || true
            )"

            echo "Readiness recovery attempt ${attempt}/30: ${ready_status}"

            if [ "${ready_status}" = "200" ]; then
              readiness_recovered=true
              break
            fi

            sleep 2
          done

          if [ "${readiness_recovered}" != "true" ]; then
            echo "API readiness did not recover after Redis restarted."
            exit 1
          fi

      - name: Collect container logs
        if: always()
        run: |
          docker compose \
            -f "${COMPOSE_FILE}" \
            logs \
            --no-color \
            > production-gate-containers.log \
            || true

      - name: Shutdown production gate
        if: always()
        run: |
          docker compose \
            -f "${COMPOSE_FILE}" \
            down \
            -v \
            --remove-orphans \
            || true

      - name: Upload production gate results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-gate-results-${{ github.sha }}-${{ github.run_id }}
          if-no-files-found: warn
          # This artifact is ~45-60 MB per run and every push/PR produces one. At 14 days they added up to
          # ~19 GB and the account hit GitHub's artifact storage quota (2026-10-03): every later
          # upload-artifact -- including Gitleaks' own report -- failed with "Artifact storage quota has
          # been hit", which failed CI and cascaded into the Production Gate. 3 days is enough to
          # investigate a red run; keep it short.
          retention-days: 3
          path: |
            **/TestResults/**
            artifacts/coverage/**
            artifacts/vulnerability/**
            artifacts/production-gate/**
            artifacts/supply-chain/**
            production-gate-containers.log

  observability-validation:
    name: Mandatory Observability Export Gate
    needs:
      - build-test-container
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Run observability tests
        run: dotnet test tests/HudhudNestApi.Observability.Tests/HudhudNestApi.Observability.Tests.csproj --configuration Release
      - name: Validate observability configuration artifacts
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD/observability/otel-collector:/config:ro" \
            otel/opentelemetry-collector-contrib:0.132.0 \
            validate --config=/config/config.yaml
          docker run --rm -v "$PWD/observability/prometheus:/etc/prometheus:ro" \
            --entrypoint promtool prom/prometheus:v3.5.0 \
            check config /etc/prometheus/prometheus.yml
          jq -e . observability/grafana/dashboards/hudhudnest-production.json >/dev/null
          docker compose -f observability/docker-compose.observability.yml config --quiet
      - name: Start local observability stack
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f observability/docker-compose.observability.yml up -d --build \
            postgres redis tempo otel-collector prometheus grafana synthetic-http
          docker compose -f observability/docker-compose.observability.yml run --rm migrator
          docker compose -f observability/docker-compose.observability.yml up -d api
          for attempt in $(seq 1 60); do
            curl --fail --silent --max-time 5 http://127.0.0.1:18080/health/ready >/dev/null && exit 0
            sleep 3
          done
          docker compose -f observability/docker-compose.observability.yml logs --no-color
          exit 1
      - name: Verify stored telemetry, dashboards, redaction and alert lifecycle
        shell: bash
        env:
          OBSERVABILITY_TEST_KEY: local-staging-cleanup-secret-at-least-32-characters
          EXPECTED_COMMIT_SHA: local-observability
        run: bash scripts/verify-observability.sh
      - name: Upload observability evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: observability-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30
          path: artifacts/observability/observability-verification-report.json
      - name: Stop observability stack
        if: always()
        run: docker compose -f observability/docker-compose.observability.yml down -v --remove-orphans

  validate-redis-ha-topology:
    name: Validate Redis HA Topology Evidence
    needs:
      - build-test-container

    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/master'

    runs-on: ubuntu-24.04
    environment: staging
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Redis HA evidence
        shell: bash
        env:
          REDIS_HA_EVIDENCE_JSON: ${{ secrets.REDIS_HA_EVIDENCE_JSON }}
          REDIS_HA_OUTPUT_DIR: artifacts/redis-ha
        run: |
          set -euo pipefail
          mkdir -p "${REDIS_HA_OUTPUT_DIR}"
          # No managed Redis HA provider (e.g. Upstash Multi-Zone) is wired to
          # Staging yet, and this pipeline no longer treats that absence as a
          # failure (see docs/REDIS-HA.md "Production Redis HA Decision" and
          # "Provider-Neutral Production Gate"). The mandatory, always-enforced
          # proof of Redis HA capability is the redis-sentinel-ha job below,
          # which is provider-independent. If/when a real managed provider is
          # configured for Staging, set REDIS_HA_EVIDENCE_JSON and this step
          # resumes strict, fail-closed validation of that provider's evidence.
          if [ -z "${REDIS_HA_EVIDENCE_JSON:-}" ]; then
            echo "::notice::REDIS_HA_EVIDENCE_JSON is not configured. Skipping managed-provider Redis HA evidence validation -- this is not a failure. See docs/REDIS-HA.md."
            {
              echo "# Redis HA Provider Evidence"
              echo ""
              echo "Status: skipped (no managed Redis HA provider configured for Staging)"
              echo ""
              echo "Redis HA capability is instead proven by the provider-neutral redis-sentinel-ha job."
            } > "${REDIS_HA_OUTPUT_DIR}/redis-ha-validation-summary.md"
            exit 0
          fi
          bash scripts/verify-redis-ha.sh

      - name: Upload Redis HA validation artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: redis-ha-validation
          if-no-files-found: warn
          retention-days: 30
          path: artifacts/redis-ha/**

  redis-sentinel-ha:
    name: Redis Sentinel HA Failover Drill (self-hosted, CI-native)
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    # No `if:` restriction: unlike validate-redis-ha-topology and
    # redis-staging-failover above (which depend on a managed provider and a
    # live Staging deployment), this job is fully self-contained -- it brings
    # up a real Redis OSS + Replication + Sentinel topology in this job's own
    # Docker daemon and kills the real primary container. It costs nothing
    # and depends on nothing external, so it runs on every pull_request and
    # push, not just master, giving real HA-failover coverage per change
    # instead of only at release time. See docs/REDIS-HA.md.
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Docker Compose configuration
        run: |
          set -euo pipefail
          docker compose -f "${COMPOSE_FILE}" config --quiet

      - name: Start Redis Sentinel HA topology
        run: |
          set -euo pipefail
          docker compose \
            -f "${COMPOSE_FILE}" \
            up \
            -d \
            --wait \
            --wait-timeout 60 \
            redis-primary \
            redis-replica \
            redis-sentinel-1 \
            redis-sentinel-2 \
            redis-sentinel-3
          docker compose -f "${COMPOSE_FILE}" ps

      - name: Run Redis Sentinel HA failover drill
        env:
          REDIS_SENTINEL_HA_OUTPUT_DIR: artifacts/redis-sentinel-ha
        run: |
          set -euo pipefail
          bash scripts/verify-redis-sentinel-ha.sh

      - name: Upload Redis Sentinel HA drill artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: redis-sentinel-ha-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 30
          path: artifacts/redis-sentinel-ha/**

      - name: Stop Redis Sentinel HA topology
        if: always()
        run: |
          docker compose -f "${COMPOSE_FILE}" down -v --remove-orphans

  staging-smoke:
    name: Mandatory Staging Deploy + E2E Smoke
    needs:
      - build-test-container
      - observability-validation
      - validate-redis-ha-topology
      - redis-sentinel-ha

    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/master'

    runs-on: ubuntu-24.04
    environment: staging
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Validate mandatory staging configuration
        shell: bash
        env:
          STAGING_BASE_URL: ${{ vars.STAGING_BASE_URL }}
          PRODUCTION_BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
          STAGING_DEPLOY_HOOK_URL: ${{ secrets.STAGING_DEPLOY_HOOK_URL }}
          STAGING_SMOKE_PHONE_PREFIX: ${{ vars.STAGING_SMOKE_PHONE_PREFIX }}
          STAGING_SMOKE_PASSWORD: ${{ secrets.STAGING_SMOKE_PASSWORD }}
          STAGING_SMOKE_FIXED_OTP: ${{ secrets.STAGING_SMOKE_FIXED_OTP }}
          STAGING_SMOKE_CLEANUP_SECRET: ${{ secrets.STAGING_SMOKE_CLEANUP_SECRET }}
          EXPECTED_COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          bash scripts/smoke-staging.sh --validate-only

      - name: Apply database migrations to Staging
        shell: bash
        env:
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          set -euo pipefail
          # The API never migrates on startup (see docs/DATABASE-PRODUCTION-READINESS.md), and
          # the Render Free Staging service has no pre-deploy command, so nothing else applies
          # migrations to Staging. Without this step a release that ships a migration is
          # deployed with complete=false forever and the readiness wait below times out.
          # Migrations are applied *before* the deploy hook so the old code keeps serving on
          # the (additive) new schema until the new build takes over.
          mkdir -p artifacts/staging-smoke
          if [ -z "${STAGING_DATABASE_URL:-}" ]; then
            echo "::error::STAGING_DATABASE_URL is not set. Add the Render Staging Postgres external connection string as a secret on the 'staging' GitHub environment (see docs/testing/staging-smoke-runbook.md)."
            exit 1
          fi
          echo "::add-mask::${STAGING_DATABASE_URL}"
          db_name="${STAGING_DATABASE_URL##*/}"
          db_name="${db_name%%\?*}"
          case "${db_name,,}" in
            *staging*) ;;
            *) echo "::error::Refusing to migrate: target database name does not contain 'staging'."; exit 1 ;;
          esac
          connection="${STAGING_DATABASE_URL}"
          case "${connection}" in
            *sslmode=*) ;;
            *\?*) connection="${connection}&sslmode=require" ;;
            *) connection="${connection}?sslmode=require" ;;
          esac
          # Testing environment: the Migrator's Staging/Production mode demands a Redis
          # configuration it never uses; schema + seed logic is environment-independent.
          export ASPNETCORE_ENVIRONMENT=Testing DOTNET_ENVIRONMENT=Testing
          export ConnectionStrings__DefaultConnection="${connection}"
          export Jwt__Issuer=HudhudNest Jwt__Audience=HudhudNestClient
          Jwt__Key="$(openssl rand -base64 48 | tr -d '\n')"
          OtpSettings__SecretKey="$(openssl rand -base64 48 | tr -d '\n')"
          Security__PhoneLookupHmacKey="$(openssl rand -base64 32 | tr -d '\n')"
          export Jwt__Key OtpSettings__SecretKey Security__PhoneLookupHmacKey
          dotnet run --project tools/HudhudNestApi.Migrator/HudhudNestApi.Migrator.csproj \
            --configuration Release > artifacts/staging-smoke/staging-migrator.log 2>&1 || {
            grep -E "pending migration|fail|Exception" artifacts/staging-smoke/staging-migrator.log | head -20 || true
            echo "::error::Staging migrator failed; see staging-migrator.log in the evidence artifact."
            exit 1
          }
          grep -E "pending migration|completed" artifacts/staging-smoke/staging-migrator.log || true

      - name: Trigger staging deployment
        shell: bash
        env:
          STAGING_DEPLOY_HOOK_URL: ${{ secrets.STAGING_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/staging-smoke
          response_file="$(mktemp)"
          trap 'rm -f "${response_file}"' EXIT
          curl --fail --silent --show-error \
            --request POST \
            --max-time 30 \
            --output "${response_file}" \
            "${STAGING_DEPLOY_HOOK_URL}"
          deployment_id="$(jq -r '.deploy.id // .id // empty' "${response_file}" 2>/dev/null || true)"
          if [ -n "${deployment_id}" ]; then
            echo "deployment_id=${deployment_id}" >> "${GITHUB_ENV}"
            echo "Staging deployment was triggered (provider deployment id captured)."
          else
            echo "Staging deployment was triggered; the hook returned no deployment id."
          fi

      - name: Wait for intended staging release
        shell: bash
        env:
          STAGING_BASE_URL: ${{ vars.STAGING_BASE_URL }}
          EXPECTED_COMMIT_SHA: ${{ github.sha }}
          STAGING_READY_TIMEOUT_SECONDS: ${{ vars.STAGING_READY_TIMEOUT_SECONDS || '900' }}
          # RELEASE-BLOCKERS-AR.md B-8: build-info is no longer anonymous — it now requires
          # the same Staging automation secret the cleanup call already sends.
          STAGING_SMOKE_CLEANUP_SECRET: ${{ secrets.STAGING_SMOKE_CLEANUP_SECRET }}
        run: |
          set -euo pipefail
          base_url="${STAGING_BASE_URL%/}"
          deadline=$((SECONDS + STAGING_READY_TIMEOUT_SECONDS))
          release_ready=false
          attempt=0
          verification_started="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          mkdir -p artifacts/staging-smoke
          last_reason="no attempt completed"
          pending_count=""; applied_count=""; latest_migration=""; health_ready=""
          write_verification() {
            # Secret-free evidence of what was expected vs. actually running.
            jq -n --arg expected "${EXPECTED_COMMIT_SHA}" --arg deployed "${deployed_sha:-}" \
              --arg env "${environment:-}" --arg ref "${GITHUB_REF_NAME}" --arg repo "${GITHUB_REPOSITORY}" \
              --arg started "${verification_started}" --arg finished "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --arg deploymentId "${deployment_id:-}" --arg reason "${last_reason}" \
              --arg migrationsComplete "${migrations_complete:-}" --arg pending "${pending_count}" \
              --arg applied "${applied_count}" --arg latest "${latest_migration}" \
              --arg ready "${health_ready}" --argjson attempts "${attempt}" --arg ok "${release_ready}" \
              '{expectedCommitSha:$expected,deployedCommitSha:$deployed,
                commitShaMatches:(($expected|ascii_downcase)==($deployed|ascii_downcase)),
                environment:$env,triggeredFromBranch:$ref,repository:$repo,providerDeploymentId:$deploymentId,
                migration:{complete:$migrationsComplete,pendingCount:$pending,appliedCount:$applied,latest:$latest},
                readiness:$ready,startedAtUtc:$started,finishedAtUtc:$finished,attempts:$attempts,
                ready:($ok=="true"),lastReason:$reason}' \
              > artifacts/staging-smoke/staging-release-verification.json
          }
          while [ "${SECONDS}" -lt "${deadline}" ]; do
            attempt=$((attempt + 1))
            deployed_sha=""
            environment=""
            migrations_complete=""
            postgis_available=""
            body="$(mktemp)"
            status="$(curl --location --silent --show-error --max-time 15 \
              --header "X-Staging-Smoke-Secret: ${STAGING_SMOKE_CLEANUP_SECRET}" \
              --output "${body}" --write-out '%{http_code}' \
              "${base_url}/api/operational/build-info" || true)"
            if [ "${status}" = "200" ] && jq -e . "${body}" > /dev/null 2>&1; then
              deployed_sha="$(jq -r '.commitSha // empty' "${body}")"
              environment="$(jq -r '.environment // empty' "${body}")"
              migrations_complete="$(jq -r '.migration.complete // false' "${body}")"
              postgis_available="$(jq -r '.migration.postGisAvailable // false' "${body}")"
              pending_count="$(jq -r '.migration.pendingCount // empty' "${body}")"
              applied_count="$(jq -r '.migration.appliedCount // empty' "${body}")"
              latest_migration="$(jq -r '.migration.latest // empty' "${body}")"
              if [ "${environment}" = "Staging" ] && \
                 [ "${deployed_sha,,}" = "${EXPECTED_COMMIT_SHA,,}" ] && \
                 [ "${migrations_complete}" = "true" ] && \
                 [ "${postgis_available}" = "true" ] && \
                 curl --fail --silent --show-error --max-time 10 \
                   "${base_url}/health/ready" > /dev/null; then
                release_ready=true
                health_ready=200
                last_reason="ready"
                rm -f "${body}"
                break
              fi
            fi
            # Surface *why* this attempt did not count as ready. Without this,
            # a genuine timeout gives no signal to distinguish "Staging is
            # still slowly deploying/migrating" from "Staging deployed a
            # different commit than expected" (e.g. the Render service still
            # tracking a stale branch) -- both looked identical before this
            # change: 180 identical "Waiting..." lines and then a bare timeout.
            if [ "${status}" != "200" ]; then
              echo "Waiting for intended Staging release (attempt ${attempt}): build-info returned HTTP ${status}."
            else
              echo "Waiting for intended Staging release (attempt ${attempt}): commitSha=${deployed_sha:-<none>} (expected ${EXPECTED_COMMIT_SHA}), environment=${environment:-<none>}, migrationsComplete=${migrations_complete:-false} (pending=${pending_count:-?}, applied=${applied_count:-?}, latest=${latest_migration:-?}), postGisAvailable=${postgis_available:-false}."
              last_reason="commitSha=${deployed_sha:-none} migrationsComplete=${migrations_complete:-false} pending=${pending_count:-?} postGis=${postgis_available:-false}"
            fi
            [ "${status}" = "200" ] || last_reason="build-info returned HTTP ${status}"
            rm -f "${body}"
            sleep 5
          done
          write_verification
          if [ "${release_ready}" != "true" ]; then
            echo "::error::Staging did not activate the intended commit with complete migrations before timeout (last state: ${last_reason}). See staging-release-verification.json: commitShaMatches=false means a stale deploy or a service tracking the wrong branch; commitShaMatches=true with pending migrations means the Staging database was not migrated."
            exit 1
          fi

      - name: Wake Staging telemetry collector
        shell: bash
        env:
          OTEL_COLLECTOR_URL: ${{ vars.STAGING_OTEL_COLLECTOR_URL }}
        run: |
          # Render Free spins the collector down when idle and the freshly deployed API's own
          # pushes do not bring it back in time (run 35466879093: no telemetry for 10 minutes,
          # data within 40 s of a direct request). Best effort, never fails the job.
          bash scripts/wake-otel-collector.sh

      - name: Run mandatory staging E2E smoke tests
        shell: bash
        env:
          STAGING_BASE_URL: ${{ vars.STAGING_BASE_URL }}
          PRODUCTION_BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
          EXPECTED_COMMIT_SHA: ${{ github.sha }}
          STAGING_SMOKE_PHONE_PREFIX: ${{ vars.STAGING_SMOKE_PHONE_PREFIX }}
          STAGING_SMOKE_PASSWORD: ${{ secrets.STAGING_SMOKE_PASSWORD }}
          STAGING_SMOKE_FIXED_OTP: ${{ secrets.STAGING_SMOKE_FIXED_OTP }}
          STAGING_SMOKE_CLEANUP_SECRET: ${{ secrets.STAGING_SMOKE_CLEANUP_SECRET }}
          SMOKE_HTTP_TIMEOUT_SECONDS: ${{ vars.SMOKE_HTTP_TIMEOUT_SECONDS || '20' }}
          SMOKE_MAX_RETRIES: ${{ vars.SMOKE_MAX_RETRIES || '5' }}
          SMOKE_RETRY_DELAY_SECONDS: ${{ vars.SMOKE_RETRY_DELAY_SECONDS || '3' }}
        run: |
          bash scripts/smoke-staging.sh

      - name: Verify observability for intended Staging release
        shell: bash
        env:
          API_BASE_URL: ${{ vars.STAGING_BASE_URL }}
          PROMETHEUS_URL: ${{ vars.STAGING_PROMETHEUS_URL }}
          TEMPO_URL: ${{ vars.STAGING_TEMPO_URL }}
          OTEL_COLLECTOR_URL: ${{ vars.STAGING_OTEL_COLLECTOR_URL }}
          OBSERVABILITY_TEST_KEY: ${{ secrets.STAGING_SMOKE_CLEANUP_SECRET }}
          OBSERVABILITY_SERVICE_VERSION: ${{ github.sha }}
          EXPECTED_COMMIT_SHA: ${{ github.sha }}
          OBSERVABILITY_ENVIRONMENT: Staging
        run: |
          set -euo pipefail
          for variable in API_BASE_URL PROMETHEUS_URL TEMPO_URL OBSERVABILITY_TEST_KEY; do
            if [ -z "${!variable:-}" ]; then
              echo "::error::${variable} is mandatory for Staging observability verification."
              exit 1
            fi
          done
          bash scripts/verify-observability.sh

      - name: Write failure evidence for missing reports
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          d=artifacts/staging-smoke
          o=artifacts/observability
          mkdir -p "$d/test-results" "$o"
          reason="A step before the E2E smoke tests failed or was skipped; see the job log."
          if [ -s "$d/staging-release-verification.json" ]; then
            reason="$(jq -r '"Staging release not ready: " + .lastReason' "$d/staging-release-verification.json")"
          fi
          if [ ! -s "$d/staging-smoke-report.json" ]; then
            jq -n --arg r "$reason" --arg sha "${GITHUB_SHA}" \
              '{environment:"Staging",expectedCommitSha:$sha,journeys:[],result:"failed",error:$r}' > "$d/staging-smoke-report.json"
            printf '<?xml version="1.0" encoding="utf-8"?>\n<testsuites><testsuite name="HudhudNestApi.StagingSmoke.Bootstrap" tests="1" failures="1"><testcase name="release-ready"><failure message="%s"/></testcase></testsuite></testsuites>\n' "$reason" > "$d/staging-smoke-junit.xml"
            printf '# Staging E2E smoke report\n\n- Result: **Failed**\n- Reason: %s\n' "$reason" > "$d/staging-smoke-summary.md"
          fi
          if [ ! -s "$o/observability-verification-report.json" ]; then
            jq -n --arg r "$reason" '{result:"not-run",reason:$r}' > "$o/observability-verification-report.json"
          fi
          [ -e "$d/test-results/.keep" ] || echo "no per-test artifacts produced" > "$d/test-results/.keep"

      - name: Upload sanitized staging evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staging-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30
          path: |
            artifacts/staging-smoke/staging-smoke-report.json
            artifacts/staging-smoke/staging-smoke-junit.xml
            artifacts/staging-smoke/staging-smoke-summary.md
            artifacts/staging-smoke/staging-release-verification.json
            artifacts/staging-smoke/staging-migrator.log
            artifacts/staging-smoke/test-results/**
            artifacts/observability/observability-verification-report.json

  redis-staging-failover:
    name: Redis Staging Managed Failover
    needs:
      - staging-smoke
      - validate-redis-ha-topology

    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/master'

    runs-on: ubuntu-24.04
    environment: staging
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Execute provider Redis failover drill
        shell: bash
        env:
          REDIS_FAILOVER_ENVIRONMENT: Staging
          STAGING_BASE_URL: ${{ vars.STAGING_BASE_URL }}
          REDIS_PROVIDER_FAILOVER_COMMAND: ${{ secrets.REDIS_PROVIDER_FAILOVER_COMMAND }}
          REDIS_FAILOVER_REPORT_PATH: artifacts/redis-failover/redis-failover-report.json
          REDIS_FAILOVER_SUMMARY_PATH: artifacts/redis-failover/redis-failover-summary.md
          REDIS_FAILOVER_JUNIT_PATH: artifacts/redis-failover/redis-failover-junit.xml
        run: |
          set -euo pipefail
          # No managed Redis HA provider is wired to Staging yet (no
          # REDIS_PROVIDER_FAILOVER_COMMAND secret configured). This live,
          # provider-triggered drill against the real Staging deployment
          # stays valuable for whenever a managed provider IS configured, but
          # its absence must not fail the pipeline -- the mandatory,
          # always-enforced proof of Redis HA capability is the
          # redis-sentinel-ha job, which needs no external provider. See
          # docs/REDIS-HA.md.
          if [ -z "${REDIS_PROVIDER_FAILOVER_COMMAND:-}" ]; then
            echo "::notice::REDIS_PROVIDER_FAILOVER_COMMAND is not configured. Skipping the live managed-provider failover drill -- this is not a failure. See docs/REDIS-HA.md."
            mkdir -p "$(dirname "${REDIS_FAILOVER_SUMMARY_PATH}")"
            {
              echo "# Redis Failover Drill (managed provider)"
              echo ""
              echo "Status: skipped (no managed Redis HA provider configured for Staging)"
            } > "${REDIS_FAILOVER_SUMMARY_PATH}"
            echo "skipped=true" >> "${GITHUB_ENV}"
            exit 0
          fi
          bash scripts/test-redis-failover.sh

      - name: Verify Redis post-failover recovery evidence
        if: env.skipped != 'true'
        shell: bash
        env:
          REDIS_FAILOVER_REPORT_PATH: artifacts/redis-failover/redis-failover-report.json
          REDIS_FAILOVER_OUTPUT_DIR: artifacts/redis-failover
        run: |
          set -euo pipefail
          bash scripts/verify-redis-recovery.sh

      - name: Upload Redis failover artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: redis-staging-failover
          if-no-files-found: error
          retention-days: 30
          path: artifacts/redis-failover/**

  deploy-production:
    name: Production Deployment (manual trigger required)
    needs:
      - build-test-container
      - observability-validation
      - validate-redis-ha-topology
      - redis-sentinel-ha
      - staging-smoke
      - redis-staging-failover
      - performance-validation
      - production-deployment-gate
    # workflow_dispatch only -- deliberately NOT `|| github.ref == 'refs/heads/main' ||
    # github.ref == 'refs/heads/master'` (which this job used to also accept). A plain push
    # to main/master still runs every gate job above for CI coverage, but can no longer reach
    # this job on its own: `environment: production` below is meant to require a human
    # reviewer's approval, but GitHub rejects configuring "Required reviewers" on a private
    # repo under this org's current billing plan ("Please ensure the billing plan supports
    # the required reviewers protection rule"). Until that's resolved (upgrade the plan, or
    # move required-reviewer protection elsewhere), restricting the trigger to an explicit,
    # deliberate workflow_dispatch is the only available guard against an unattended deploy
    # firing straight off a merge -- see docs/testing/staging-production-gate-checklist.md.
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/master' &&
      needs.build-test-container.result == 'success' &&
       needs.observability-validation.result == 'success' &&
       needs.redis-sentinel-ha.result == 'success' &&
       needs.staging-smoke.result == 'success' &&
       needs.redis-staging-failover.result == 'success' &&
       needs.performance-validation.result == 'success' &&
       needs.production-deployment-gate.result == 'success'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 10
    steps:
      # The deploy hook below tells Render to build whatever the Production service's tracked
      # branch (master) points at *right now* -- it does not carry a commit SHA. Every gate above
      # verified github.sha. If master moved after this run started (a merge landed while the
      # gates were running), the hook would ship an UNTESTED commit. Refuse in that case.
      - name: Assert the gated commit is still the tip of master
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tip="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/master" | jq -r .sha)"
          if [ "${tip,,}" != "${GITHUB_SHA,,}" ]; then
            echo "::error::master moved to ${tip} after this run started on ${GITHUB_SHA}. Production was NOT deployed: the hook would ship a commit that did not pass Staging. Re-run the workflow from the new tip."
            exit 1
          fi
          echo "Gated commit ${GITHUB_SHA} is the current tip of master."

      - name: Assert mandatory staging gate succeeded
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ needs.staging-smoke.result }}" != "success" ]; then
            echo "::error::Production is blocked because the mandatory Staging gate did not succeed."
            exit 1
          fi
          if [ "${{ needs.redis-sentinel-ha.result }}" != "success" ]; then
            echo "::error::Production is blocked because the Redis Sentinel HA failover drill did not succeed."
            exit 1
          fi
          if [ "${{ needs.performance-validation.result }}" != "success" ]; then
            echo "::error::Production is blocked because concurrent performance validation did not succeed."
            exit 1
          fi
          if [ "${{ needs.production-deployment-gate.result }}" != "success" ]; then
            echo "::error::Production is blocked because database recovery validation did not succeed."
            exit 1
          fi

      - name: Trigger production deployment
        shell: bash
        env:
          PRODUCTION_DEPLOY_HOOK_URL: ${{ secrets.PRODUCTION_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail
          if [ -z "${PRODUCTION_DEPLOY_HOOK_URL:-}" ]; then
            echo "::error::PRODUCTION_DEPLOY_HOOK_URL is required."
            exit 1
          fi
          curl --fail --silent --show-error \
            --request POST \
            --max-time 30 \
            --output /dev/null \
            "${PRODUCTION_DEPLOY_HOOK_URL}"
          echo "Production deployment was triggered after successful Staging verification."
  database-recovery:
    name: Production Database Recovery Gate
    needs:
      - build-test-container
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
       (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'))
    uses: ./.github/workflows/database-restore-drill.yml
    with:
      fresh_backup: true
    secrets: inherit

  production-deployment-gate:
    name: Production Deployment Gate
    needs:
      - build-test-container
      - staging-smoke
      - database-recovery
    if: >-
      always() &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' &&
        (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')))
    runs-on: ubuntu-24.04
    environment: production-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require a previous known-good Render deploy
        shell: bash
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          set -euo pipefail

          if [ -z "${RENDER_API_KEY:-}" ]; then
            echo "::error::RENDER_API_KEY is not set. Add it as a secret on the 'production-release' GitHub environment (Settings -> Environments -> production-release)."
            exit 1
          fi

          if [[ ! "${RENDER_SERVICE_ID:-}" =~ ^srv-[A-Za-z0-9]+$ ]]; then
            echo "::error::RENDER_SERVICE_ID is not set or is not in the expected 'srv-...' format. Add it as a secret on the 'production-release' GitHub environment."
            exit 1
          fi

          auth_file="$(mktemp)"
          trap 'rm -f "${auth_file}"' EXIT
          chmod 600 "${auth_file}"
          printf 'header = "Authorization: Bearer %s"\nheader = "Accept: application/json"\n' "${RENDER_API_KEY}" > "${auth_file}"

          if ! curl --fail --silent --show-error --config "${auth_file}" \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys?limit=20" > render-deploys.json; then
            echo "::error::Could not list deploys for Render service ${RENDER_SERVICE_ID}. Verify RENDER_API_KEY has access to this service and RENDER_SERVICE_ID is correct."
            exit 1
          fi

          previous_deploy_id="$(jq -r '[.. | objects | select(.status? == "live" or .status? == "deactivated") | .id? | select(. != null)] | first // empty' render-deploys.json)"

          if [ -z "${previous_deploy_id}" ]; then
            # No prior live/deactivated deploy exists yet. Treat this as the
            # first-ever production release for this service instead of
            # permanently blocking deployment (a previous "known-good" deploy
            # can never exist before the first one happens).
            echo "::warning::No previous live/deactivated Render deploy was found for ${RENDER_SERVICE_ID}. Treating this run as the first production release."
            previous_deploy_id="none-first-deploy"
          fi

          echo "PREVIOUS_KNOWN_GOOD_DEPLOY_ID=${previous_deploy_id}" >> "${GITHUB_ENV}"

      - name: Enforce successful recovery validation
        env:
          BUILD_RESULT: ${{ needs.build-test-container.result }}
          STAGING_RESULT: ${{ needs.staging-smoke.result }}
          RECOVERY_RESULT: ${{ needs.database-recovery.result }}
        run: |
          set -euo pipefail
          echo "Build gate: ${BUILD_RESULT}"
          echo "Staging gate: ${STAGING_RESULT}"
          echo "Recovery gate: ${RECOVERY_RESULT}"
          [ "${BUILD_RESULT}" = "success" ]
          [ "${STAGING_RESULT}" = "success" ]
          [ "${RECOVERY_RESULT}" = "success" ]
          echo "Production release is eligible only because actual backup restore validation passed."

      - name: Record pre-deployment recovery metadata
        shell: bash
        env:
          BACKUP_ID: ${{ needs.database-recovery.outputs.backup_id }}
          EF_CORE_MIGRATION: ${{ needs.database-recovery.outputs.ef_core_migration }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/production-release
          jq -n --arg commitSha "${GITHUB_SHA}" --arg backupId "${BACKUP_ID}" \
            --arg efCoreMigration "${EF_CORE_MIGRATION}" \
            --arg previousKnownGoodDeployId "${PREVIOUS_KNOWN_GOOD_DEPLOY_ID}" \
            --arg gateCompletedAtUtc "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{commitSha:$commitSha,backupId:$backupId,efCoreMigration:$efCoreMigration,previousKnownGoodDeployId:$previousKnownGoodDeployId,gateCompletedAtUtc:$gateCompletedAtUtc,recoveryGate:"PASS",eligibleForRenderDeploy:true}' \
            > artifacts/production-release/predeployment-recovery-metadata.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-release-recovery-metadata-${{ github.run_id }}
          retention-days: 90
          path: artifacts/production-release/*.json
