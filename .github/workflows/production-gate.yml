name: Production Gate

on:
  pull_request:
    branches:
      - main
      - master
      - develop

  push:
    branches:
      - main
      - master
      - develop

  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: 8.0.x
  COMPOSE_FILE: ci/docker-compose.production-gate.yml
  PROPERTYAPI_IMAGE_TAG: production-gate

concurrency:
  group: production-gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  performance-validation:
    name: Mandatory Concurrent Performance Gate
    uses: ./.github/workflows/performance-validation.yml
    with:
      profile: ${{ github.event_name == 'pull_request' && 'pr' || 'release' }}

  build-test-container:
    name: Build, Test and Container Gate
    runs-on: ubuntu-latest
    timeout-minutes: 40

    services:
      postgres_test:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: propertyapi_testing
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d propertyapi_testing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      redis_test:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      TEST_POSTGRES_CONNECTION_STRING: >-
        Host=127.0.0.1;Port=5432;Database=propertyapi_testing;Username=postgres;Password=postgres
      ConnectionStrings__DefaultConnection: >-
        Host=127.0.0.1;Port=5432;Database=propertyapi_testing;Username=postgres;Password=postgres
      ConnectionStrings__Redis: 127.0.0.1:6379,abortConnect=false
      Redis__ConnectionString: 127.0.0.1:6379,abortConnect=false
      Redis__Required: "false"
      ASPNETCORE_ENVIRONMENT: Testing
      DOTNET_ENVIRONMENT: Testing
      Database__ApplyMigrationsOnStartup: "false"
      Database__SeedOnStartup: "false"

      # Non-secret identifiers used by the test host.
      Jwt__Issuer: PropertyApi
      Jwt__Audience: PropertyApiClient

      Cloudinary__CloudName: ci
      Cloudinary__ApiKey: ci
      Cloudinary__ApiSecret: ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Generate ephemeral test security keys
        shell: bash
        run: |
          set -euo pipefail

          jwt_key="$(openssl rand -base64 48 | tr -d '\n')"
          otp_key="$(openssl rand -base64 48 | tr -d '\n')"
          phone_hmac_key="$(openssl rand -base64 32 | tr -d '\n')"

          echo "::add-mask::${jwt_key}"
          echo "::add-mask::${otp_key}"
          echo "::add-mask::${phone_hmac_key}"

          {
            echo "Jwt__Key=${jwt_key}"
            echo "OtpSettings__SecretKey=${otp_key}"
            echo "Security__PhoneLookupHmacKey=${phone_hmac_key}"
          } >> "${GITHUB_ENV}"

      - name: Restore dependencies
        run: dotnet restore PropertyApi.sln --locked-mode

      - name: Restore local .NET tools
        run: dotnet tool restore

      - name: Validate package governance
        shell: pwsh
        run: |
          ./scripts/validate-package-governance.ps1 `
            -RepositoryRoot $PWD.Path `
            -SolutionPath "PropertyApi.sln" `
            -PolicyPath "ci/package-policy.json" `
            -OutputDirectory "artifacts/supply-chain"

      - name: Validate GitHub Actions pinning
        run: |
          python scripts/validate-github-actions-pinning.py \
            --repository-root . \
            --output artifacts/supply-chain/action-pinning-report.json

      - name: Build solution
        run: |
          dotnet build PropertyApi.sln \
            --configuration Release \
            --no-restore

      - name: Verify formatting
        run: |
          dotnet format PropertyApi.sln \
            --verify-no-changes \
            --no-restore

      - name: Run static production gate
        shell: pwsh
        run: |
          ./scripts/verify-production-gate.ps1 `
            -RepositoryRoot $PWD.Path

      - name: Enforce migration recovery classification
        shell: bash
        run: bash scripts/database/analyze-migrations.sh

      - name: Verify test infrastructure
        run: |
          set -euo pipefail

          docker exec \
            "${{ job.services.postgres_test.id }}" \
            pg_isready \
            -U postgres \
            -d propertyapi_testing

          redis_response="$(
            docker exec \
              "${{ job.services.redis_test.id }}" \
              redis-cli \
              ping
          )"

          if [ "${redis_response}" != "PONG" ]; then
            echo "Redis test service did not return PONG."
            exit 1
          fi

      - name: Apply integration-test database migrations
        run: |
          set -euo pipefail

          dotnet run \
            --project tools/PropertyApi.Migrator/PropertyApi.Migrator.csproj \
            --configuration Release \
            --no-build

      - name: Run architecture tests without coverage instrumentation
        run: |
          dotnet test \
            tests/PropertyApi.Architecture.Tests/PropertyApi.Architecture.Tests.csproj \
            --configuration Release \
            --no-build \
            --logger "trx;LogFileName=architecture-tests.trx"

      - name: Run application tests with coverage
        run: |
          dotnet test \
            tests/PropertyApi.Application.Tests/PropertyApi.Application.Tests.csproj \
            --configuration Release \
            --no-build \
            --collect:"XPlat Code Coverage" \
            --logger "trx;LogFileName=application-tests.trx"

      - name: Run authentication tests with coverage
        run: |
          dotnet test \
            tests/PropertyApi.Auth.Tests/PropertyApi.Auth.Tests.csproj \
            --configuration Release \
            --no-build \
            --collect:"XPlat Code Coverage" \
            --logger "trx;LogFileName=auth-tests.trx"

      - name: Run integration tests with coverage
        run: |
          dotnet test \
            tests/PropertyApi.Integration.Tests/PropertyApi.Integration.Tests.csproj \
            --configuration Release \
            --no-build \
            --collect:"XPlat Code Coverage" \
            --logger "trx;LogFileName=integration-tests.trx"

      - name: Validate test result files
        shell: pwsh
        run: |
          ./scripts/validate-test-results.ps1 `
            -TestResultsRoot "." `
            -OutputDirectory "artifacts/supply-chain"

      - name: Check vulnerable packages
        shell: pwsh
        run: |
          ./ci/check-vulnerable-packages.ps1 `
            -SolutionPath "PropertyApi.sln" `
            -BaselinePath "ci/vulnerability-baseline.json" `
            -OutputDirectory "artifacts/vulnerability"

      - name: Check coverage baseline
        shell: pwsh
        run: |
          ./ci/check-coverage-baseline.ps1 `
            -CoverageRoot "." `
            -BaselinePath "ci/coverage-baseline.json" `
            -OutputDirectory "artifacts/coverage"

      - name: Validate staged coverage thresholds
        run: |
          python scripts/validate-coverage-thresholds.py \
            --repository-root . \
            --coverage-root . \
            --policy ci/coverage-thresholds.json \
            --output-directory artifacts/coverage

      - name: Generate coverage report
        run: |
          dotnet tool run reportgenerator -- \
            -reports:"**/coverage.cobertura.xml" \
            -targetdir:"artifacts/coverage/report" \
            -reporttypes:"HtmlInline;Cobertura;MarkdownSummaryGithub"

          if [ -f artifacts/coverage/report/SummaryGithub.md ]; then
            cat artifacts/coverage/report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Validate Docker Compose configuration
        run: |
          set -euo pipefail

          docker compose \
            -f "${COMPOSE_FILE}" \
            config \
            --quiet

      - name: Build production-like images
        run: |
          set -euo pipefail

          docker compose \
            -f "${COMPOSE_FILE}" \
            build \
            --pull \
            api \
            migrator

      - name: Capture API image digest
        id: capture-api-image
        run: |
          set -euo pipefail

          api_image_ref="propertyapi-api:${PROPERTYAPI_IMAGE_TAG}"
          api_image_digest="$(
            docker image inspect \
              --format '{{.Id}}' \
              "${api_image_ref}"
          )"

          if [[ ! "${api_image_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Could not capture an immutable sha256 image id for ${api_image_ref}."
            exit 1
          fi

          {
            echo "image_ref=${api_image_ref}"
            echo "image_digest=${api_image_digest}"
          } >> "${GITHUB_OUTPUT}"

          {
            echo "PROPERTYAPI_IMAGE_REF=${api_image_ref}"
            echo "PROPERTYAPI_IMAGE_DIGEST=${api_image_digest}"
          } >> "${GITHUB_ENV}"

          mkdir -p artifacts/supply-chain
          jq -n \
            --arg imageRef "${api_image_ref}" \
            --arg imageDigest "${api_image_digest}" \
            --arg commitSha "${GITHUB_SHA}" \
            '{imageRef: $imageRef, imageDigest: $imageDigest, commitSha: $commitSha}' \
            > artifacts/supply-chain/image-digest.json

      - name: Generate application SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: cyclonedx
          output: artifacts/supply-chain/propertyapi-dotnet.cdx.json
          scanners: vuln
          skip-dirs: artifacts

      - name: Generate container SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.capture-api-image.outputs.image_digest }}
          format: spdx-json
          output: artifacts/supply-chain/propertyapi-container.spdx.json
          scanners: vuln

      - name: Scan container image as JSON
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.capture-api-image.outputs.image_digest }}
          format: json
          output: artifacts/supply-chain/container-scan.json
          scanners: vuln,secret,misconfig
          vuln-type: os,library
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: '0'

      - name: Scan container image as SARIF
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.capture-api-image.outputs.image_digest }}
          format: sarif
          output: artifacts/supply-chain/container-scan.sarif
          scanners: vuln,secret,misconfig
          vuln-type: os,library
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: '0'

      - name: Validate release security evidence
        run: |
          python scripts/generate-release-security-manifest.py \
            --repository-root . \
            --output artifacts/supply-chain/release-security-manifest.json \
            --sbom-metadata-output artifacts/supply-chain/sbom-metadata.json \
            --correlation-output artifacts/supply-chain/sbom-vulnerability-report.json \
            --summary-output artifacts/supply-chain/release-security-manifest.md \
            --container-scan-summary-output artifacts/supply-chain/container-scan-summary.md

      - name: Start PostgreSQL and Redis
        run: |
          set -euo pipefail

          docker compose \
            -f "${COMPOSE_FILE}" \
            up \
            -d \
            --wait \
            --wait-timeout 120 \
            postgres \
            redis

          docker compose \
            -f "${COMPOSE_FILE}" \
            ps

      - name: Run database migrator
        run: |
          set -euo pipefail
 
          max_attempts=5
          attempt=1
 
          until docker compose \
            -f "${COMPOSE_FILE}" \
            run \
            --rm \
            --no-deps \
            migrator; do
 
            if [ "${attempt}" -ge "${max_attempts}" ]; then
              echo "::error::Migrator failed after ${max_attempts} attempts."
              docker compose -f "${COMPOSE_FILE}" logs --no-color postgres
              exit 1
            fi
 
            echo "Migrator attempt ${attempt}/${max_attempts} failed (likely Postgres not fully ready). Retrying in 5s..."
            attempt=$((attempt + 1))
            sleep 5
          done

      - name: Verify applied migrations
        run: |
          set -euo pipefail

          migration_count="$(
            docker compose \
              -f "${COMPOSE_FILE}" \
              exec \
              -T \
              postgres \
              psql \
              -U postgres \
              -d propertyapi_gate \
              -tAc \
              'SELECT COUNT(*) FROM "__EFMigrationsHistory";'
          )"

          migration_count="$(echo "${migration_count}" | tr -d '[:space:]')"

          echo "Applied migration count: ${migration_count}"

          if [ -z "${migration_count}" ] || [ "${migration_count}" -le 0 ]; then
            echo "No EF Core migrations were found."
            exit 1
          fi

      - name: Verify PostGIS
        run: |
          set -euo pipefail

          docker compose \
            -f "${COMPOSE_FILE}" \
            exec \
            -T \
            postgres \
            psql \
            -U postgres \
            -d propertyapi_gate \
            -c "SELECT PostGIS_Version();"

      - name: Start API
        run: |
          set -euo pipefail

          docker compose \
            -f "${COMPOSE_FILE}" \
            up \
            -d \
            api

      - name: Wait for API liveness
        shell: bash
        run: |
          set -euo pipefail

          api_ready=false

          for attempt in $(seq 1 60); do
            echo "Liveness attempt ${attempt}/60"

            if curl \
              --fail \
              --silent \
              --show-error \
              --max-time 5 \
              http://127.0.0.1:18080/health/live \
              > /dev/null; then

              api_ready=true
              break
            fi

            sleep 2
          done

          if [ "${api_ready}" != "true" ]; then
            echo "API did not become live."

            docker compose \
              -f "${COMPOSE_FILE}" \
              logs \
              --no-color \
              api

            exit 1
          fi

      - name: Verify liveness and readiness
        run: |
          set -euo pipefail

          curl \
            --fail \
            --silent \
            --show-error \
            --max-time 10 \
            http://127.0.0.1:18080/health/live

          echo

          curl \
            --fail \
            --silent \
            --show-error \
            --max-time 10 \
            http://127.0.0.1:18080/health/ready

          echo

      - name: Assert API container is non-root
        run: |
          set -euo pipefail

          # The runtime image (mcr.microsoft.com/dotnet/aspnet:8.0-jammy-chiseled-extra)
          # is a distroless-style image: it has no shell and no coreutils, so
          # `docker compose exec api id -u` fails with "executable file not
          # found in $PATH" (exit 127). Instead, read the effective user Docker
          # actually started the container's process with, which reflects the
          # Dockerfile's `USER $APP_UID` (and any compose-level override, if
          # one is ever added) without needing to exec anything inside the
          # container.

          api_container_id="$(
            docker compose \
              -f "${COMPOSE_FILE}" \
              ps \
              -q \
              api
          )"

          if [ -z "${api_container_id}" ]; then
            echo "API container was not found."
            exit 1
          fi

          uid="$(
            docker inspect \
              --format '{{.Config.User}}' \
              "${api_container_id}"
          )"

          echo "API container configured user: ${uid}"

          if [ -z "${uid}" ] || [ "${uid}" = "0" ] || [ "${uid}" = "root" ]; then
            echo "API container is running as root."
            exit 1
          fi

      - name: Verify Data Protection key persistence
        run: |
          set -euo pipefail

          key_count="$(
            docker compose \
              -f "${COMPOSE_FILE}" \
              exec \
              -T \
              postgres \
              psql \
              -U postgres \
              -d propertyapi_gate \
              -tAc \
              'SELECT COUNT(*) FROM "DataProtectionKeys";'
          )"

          key_count="$(echo "${key_count}" | tr -d '[:space:]')"

          echo "Data Protection key count: ${key_count}"

          if [ -z "${key_count}" ] || [ "${key_count}" -le 0 ]; then
            echo "No persisted Data Protection key was found."
            exit 1
          fi

      - name: Assert API does not use filesystem key storage
        run: |
          set -euo pipefail

          api_logs="$(
            docker compose \
              -f "${COMPOSE_FILE}" \
              logs \
              --no-color \
              api
          )"

          if echo "${api_logs}" |
            grep -E \
              'FileSystemXmlRepository|/home/app/.aspnet/DataProtection-Keys'; then

            echo "API is using ephemeral filesystem Data Protection keys."
            exit 1
          fi

          echo "Data Protection keys are not stored in the container filesystem."

      - name: Verify readiness failure when Redis is unavailable
        id: redis-outage-test
        shell: bash
        run: |
          set -euo pipefail

          echo "redis_stopped=false" >> "${GITHUB_OUTPUT}"

          redis_container_id="$(
            docker compose \
              -f "${COMPOSE_FILE}" \
              ps \
              -q \
              redis \
              2>/dev/null \
              || true
          )"

          if [ -z "${redis_container_id}" ]; then
            echo "Redis container does not exist."
            exit 1
          fi

          docker compose \
            -f "${COMPOSE_FILE}" \
            stop \
            redis

          echo "redis_stopped=true" >> "${GITHUB_OUTPUT}"

          dependency_failure_verified=false

          for attempt in $(seq 1 30); do
            live_status="$(
              curl \
                --silent \
                --output /dev/null \
                --write-out "%{http_code}" \
                --max-time 10 \
                http://127.0.0.1:18080/health/live \
                || true
            )"

            ready_status="$(
              curl \
                --silent \
                --output /dev/null \
                --write-out "%{http_code}" \
                --max-time 15 \
                http://127.0.0.1:18080/health/ready \
                || true
            )"

            echo "Dependency failure attempt ${attempt}/30"
            echo "Liveness status without Redis: ${live_status}"
            echo "Readiness status without Redis: ${ready_status}"

            if [ "${live_status}" = "200" ] && [ "${ready_status}" = "503" ]; then
              dependency_failure_verified=true
              break
            fi

            sleep 2
          done

          if [ "${dependency_failure_verified}" != "true" ]; then
            echo "Expected liveness 200 and readiness 503 after stopping Redis."
            exit 1
          fi

      - name: Restore Redis and verify readiness recovery
        if: ${{ always() && steps.redis-outage-test.outputs.redis_stopped == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          redis_container_id="$(
            docker compose \
              -f "${COMPOSE_FILE}" \
              ps \
              -a \
              -q \
              redis \
              2>/dev/null \
              || true
          )"

          api_container_id="$(
            docker compose \
              -f "${COMPOSE_FILE}" \
              ps \
              -a \
              -q \
              api \
              2>/dev/null \
              || true
          )"

          if [ -z "${redis_container_id}" ]; then
            echo "Redis container was not created."
            exit 1
          fi

          if [ -z "${api_container_id}" ]; then
            echo "API container was not created."
            exit 1
          fi

          docker compose \
            -f "${COMPOSE_FILE}" \
            start \
            redis

          redis_ready=false

          for attempt in $(seq 1 40); do
            redis_health="$(
              docker inspect \
                --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' \
                "${redis_container_id}" \
                2>/dev/null \
                || true
            )"

            echo "Redis health attempt ${attempt}/40: ${redis_health}"

            if [ "${redis_health}" = "healthy" ]; then
              redis_ready=true
              break
            fi

            sleep 2
          done

          if [ "${redis_ready}" != "true" ]; then
            echo "Redis did not recover to a healthy state."
            exit 1
          fi

          readiness_recovered=false

          for attempt in $(seq 1 30); do
            ready_status="$(
              curl \
                --silent \
                --output /dev/null \
                --write-out "%{http_code}" \
                --max-time 10 \
                http://127.0.0.1:18080/health/ready \
                || true
            )"

            echo "Readiness recovery attempt ${attempt}/30: ${ready_status}"

            if [ "${ready_status}" = "200" ]; then
              readiness_recovered=true
              break
            fi

            sleep 2
          done

          if [ "${readiness_recovered}" != "true" ]; then
            echo "API readiness did not recover after Redis restarted."
            exit 1
          fi

      - name: Collect container logs
        if: always()
        run: |
          docker compose \
            -f "${COMPOSE_FILE}" \
            logs \
            --no-color \
            > production-gate-containers.log \
            || true

      - name: Shutdown production gate
        if: always()
        run: |
          docker compose \
            -f "${COMPOSE_FILE}" \
            down \
            -v \
            --remove-orphans \
            || true

      - name: Upload production gate results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-gate-results-${{ github.sha }}-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            **/TestResults/**
            artifacts/coverage/**
            artifacts/vulnerability/**
            artifacts/production-gate/**
            artifacts/supply-chain/**
            production-gate-containers.log

  observability-validation:
    name: Mandatory Observability Export Gate
    needs:
      - build-test-container
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Run observability tests
        run: dotnet test tests/PropertyApi.Observability.Tests/PropertyApi.Observability.Tests.csproj --configuration Release
      - name: Validate observability configuration artifacts
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD/observability/otel-collector:/config:ro" \
            otel/opentelemetry-collector-contrib:0.132.0 \
            validate --config=/config/config.yaml
          docker run --rm -v "$PWD/observability/prometheus:/etc/prometheus:ro" \
            --entrypoint promtool prom/prometheus:v3.5.0 \
            check config /etc/prometheus/prometheus.yml
          jq -e . observability/grafana/dashboards/property-api-production.json >/dev/null
          docker compose -f observability/docker-compose.observability.yml config --quiet
      - name: Start local observability stack
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f observability/docker-compose.observability.yml up -d --build \
            postgres redis tempo otel-collector prometheus grafana synthetic-http
          docker compose -f observability/docker-compose.observability.yml run --rm migrator
          docker compose -f observability/docker-compose.observability.yml up -d api
          for attempt in $(seq 1 60); do
            curl --fail --silent --max-time 5 http://127.0.0.1:18080/health/ready >/dev/null && exit 0
            sleep 3
          done
          docker compose -f observability/docker-compose.observability.yml logs --no-color
          exit 1
      - name: Verify stored telemetry, dashboards, redaction and alert lifecycle
        shell: bash
        env:
          OBSERVABILITY_TEST_KEY: local-staging-cleanup-secret-at-least-32-characters
          EXPECTED_COMMIT_SHA: local-observability
        run: bash scripts/verify-observability.sh
      - name: Upload observability evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: observability-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30
          path: artifacts/observability/observability-verification-report.json
      - name: Stop observability stack
        if: always()
        run: docker compose -f observability/docker-compose.observability.yml down -v --remove-orphans

  validate-redis-ha-topology:
    name: Validate Redis HA Topology Evidence
    needs:
      - build-test-container

    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/master'

    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Redis HA evidence
        shell: bash
        env:
          REDIS_HA_EVIDENCE_JSON: ${{ secrets.REDIS_HA_EVIDENCE_JSON }}
          REDIS_HA_OUTPUT_DIR: artifacts/redis-ha
        run: |
          set -euo pipefail
          bash scripts/verify-redis-ha.sh

      - name: Upload Redis HA validation artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: redis-ha-validation
          if-no-files-found: warn
          retention-days: 30
          path: artifacts/redis-ha/**

  staging-smoke:
    name: Mandatory Staging Deploy + E2E Smoke
    needs:
      - build-test-container
      - observability-validation
      - validate-redis-ha-topology

    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/master'

    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Validate mandatory staging configuration
        shell: bash
        env:
          STAGING_BASE_URL: ${{ vars.STAGING_BASE_URL }}
          PRODUCTION_BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
          STAGING_DEPLOY_HOOK_URL: ${{ secrets.STAGING_DEPLOY_HOOK_URL }}
          STAGING_SMOKE_PHONE_PREFIX: ${{ vars.STAGING_SMOKE_PHONE_PREFIX }}
          STAGING_SMOKE_PASSWORD: ${{ secrets.STAGING_SMOKE_PASSWORD }}
          STAGING_SMOKE_FIXED_OTP: ${{ secrets.STAGING_SMOKE_FIXED_OTP }}
          STAGING_SMOKE_CLEANUP_SECRET: ${{ secrets.STAGING_SMOKE_CLEANUP_SECRET }}
          EXPECTED_COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          bash scripts/smoke-staging.sh --validate-only

      - name: Trigger staging deployment
        shell: bash
        env:
          STAGING_DEPLOY_HOOK_URL: ${{ secrets.STAGING_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/staging-smoke
          response_file="$(mktemp)"
          trap 'rm -f "${response_file}"' EXIT
          curl --fail --silent --show-error \
            --request POST \
            --max-time 30 \
            --output "${response_file}" \
            "${STAGING_DEPLOY_HOOK_URL}"
          deployment_id="$(jq -r '.deploy.id // .id // empty' "${response_file}" 2>/dev/null || true)"
          if [ -n "${deployment_id}" ]; then
            echo "deployment_id=${deployment_id}" >> "${GITHUB_ENV}"
            echo "Staging deployment was triggered (provider deployment id captured)."
          else
            echo "Staging deployment was triggered; the hook returned no deployment id."
          fi

      - name: Wait for intended staging release
        shell: bash
        env:
          STAGING_BASE_URL: ${{ vars.STAGING_BASE_URL }}
          EXPECTED_COMMIT_SHA: ${{ github.sha }}
          STAGING_READY_TIMEOUT_SECONDS: ${{ vars.STAGING_READY_TIMEOUT_SECONDS || '900' }}
          # RELEASE-BLOCKERS-AR.md B-8: build-info is no longer anonymous — it now requires
          # the same Staging automation secret the cleanup call already sends.
          STAGING_SMOKE_CLEANUP_SECRET: ${{ secrets.STAGING_SMOKE_CLEANUP_SECRET }}
        run: |
          set -euo pipefail
          base_url="${STAGING_BASE_URL%/}"
          deadline=$((SECONDS + STAGING_READY_TIMEOUT_SECONDS))
          release_ready=false
          attempt=0
          while [ "${SECONDS}" -lt "${deadline}" ]; do
            attempt=$((attempt + 1))
            body="$(mktemp)"
            status="$(curl --location --silent --show-error --max-time 15 \
              --header "X-Staging-Smoke-Secret: ${STAGING_SMOKE_CLEANUP_SECRET}" \
              --output "${body}" --write-out '%{http_code}' \
              "${base_url}/api/operational/build-info" || true)"
            if [ "${status}" = "200" ] && jq -e . "${body}" > /dev/null 2>&1; then
              deployed_sha="$(jq -r '.commitSha // empty' "${body}")"
              environment="$(jq -r '.environment // empty' "${body}")"
              migrations_complete="$(jq -r '.migration.complete // false' "${body}")"
              postgis_available="$(jq -r '.migration.postGisAvailable // false' "${body}")"
              if [ "${environment}" = "Staging" ] && \
                 [ "${deployed_sha,,}" = "${EXPECTED_COMMIT_SHA,,}" ] && \
                 [ "${migrations_complete}" = "true" ] && \
                 [ "${postgis_available}" = "true" ] && \
                 curl --fail --silent --show-error --max-time 10 \
                   "${base_url}/health/ready" > /dev/null; then
                release_ready=true
                rm -f "${body}"
                break
              fi
            fi
            rm -f "${body}"
            echo "Waiting for intended Staging release (attempt ${attempt})."
            sleep 5
          done
          if [ "${release_ready}" != "true" ]; then
            echo "::error::Staging did not activate the intended commit with complete migrations before timeout."
            exit 1
          fi

      - name: Run mandatory staging E2E smoke tests
        shell: bash
        env:
          STAGING_BASE_URL: ${{ vars.STAGING_BASE_URL }}
          PRODUCTION_BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
          EXPECTED_COMMIT_SHA: ${{ github.sha }}
          STAGING_SMOKE_PHONE_PREFIX: ${{ vars.STAGING_SMOKE_PHONE_PREFIX }}
          STAGING_SMOKE_PASSWORD: ${{ secrets.STAGING_SMOKE_PASSWORD }}
          STAGING_SMOKE_FIXED_OTP: ${{ secrets.STAGING_SMOKE_FIXED_OTP }}
          STAGING_SMOKE_CLEANUP_SECRET: ${{ secrets.STAGING_SMOKE_CLEANUP_SECRET }}
          SMOKE_HTTP_TIMEOUT_SECONDS: ${{ vars.SMOKE_HTTP_TIMEOUT_SECONDS || '20' }}
          SMOKE_MAX_RETRIES: ${{ vars.SMOKE_MAX_RETRIES || '5' }}
          SMOKE_RETRY_DELAY_SECONDS: ${{ vars.SMOKE_RETRY_DELAY_SECONDS || '3' }}
        run: |
          bash scripts/smoke-staging.sh

      - name: Verify observability for intended Staging release
        shell: bash
        env:
          API_BASE_URL: ${{ vars.STAGING_BASE_URL }}
          PROMETHEUS_URL: ${{ vars.STAGING_PROMETHEUS_URL }}
          TEMPO_URL: ${{ vars.STAGING_TEMPO_URL }}
          OBSERVABILITY_TEST_KEY: ${{ secrets.STAGING_SMOKE_CLEANUP_SECRET }}
          OBSERVABILITY_SERVICE_VERSION: ${{ github.sha }}
          EXPECTED_COMMIT_SHA: ${{ github.sha }}
          OBSERVABILITY_ENVIRONMENT: Staging
        run: |
          set -euo pipefail
          for variable in API_BASE_URL PROMETHEUS_URL TEMPO_URL OBSERVABILITY_TEST_KEY; do
            if [ -z "${!variable:-}" ]; then
              echo "::error::${variable} is mandatory for Staging observability verification."
              exit 1
            fi
          done
          bash scripts/verify-observability.sh

      - name: Upload sanitized staging evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staging-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30
          path: |
            artifacts/staging-smoke/staging-smoke-report.json
            artifacts/staging-smoke/staging-smoke-junit.xml
            artifacts/staging-smoke/staging-smoke-summary.md
            artifacts/staging-smoke/test-results/**
            artifacts/observability/observability-verification-report.json

  redis-staging-failover:
    name: Redis Staging Managed Failover
    needs:
      - staging-smoke
      - validate-redis-ha-topology

    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/master'

    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Execute provider Redis failover drill
        shell: bash
        env:
          REDIS_FAILOVER_ENVIRONMENT: Staging
          STAGING_BASE_URL: ${{ vars.STAGING_BASE_URL }}
          REDIS_PROVIDER_FAILOVER_COMMAND: ${{ secrets.REDIS_PROVIDER_FAILOVER_COMMAND }}
          REDIS_FAILOVER_REPORT_PATH: artifacts/redis-failover/redis-failover-report.json
          REDIS_FAILOVER_SUMMARY_PATH: artifacts/redis-failover/redis-failover-summary.md
          REDIS_FAILOVER_JUNIT_PATH: artifacts/redis-failover/redis-failover-junit.xml
        run: |
          set -euo pipefail
          bash scripts/test-redis-failover.sh

      - name: Verify Redis post-failover recovery evidence
        shell: bash
        env:
          REDIS_FAILOVER_REPORT_PATH: artifacts/redis-failover/redis-failover-report.json
          REDIS_FAILOVER_OUTPUT_DIR: artifacts/redis-failover
        run: |
          set -euo pipefail
          bash scripts/verify-redis-recovery.sh

      - name: Upload Redis failover artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: redis-staging-failover
          if-no-files-found: error
          retention-days: 30
          path: artifacts/redis-failover/**

  deploy-production:
    name: Production Deployment (environment approval required)
    needs:
      - build-test-container
      - observability-validation
      - validate-redis-ha-topology
      - staging-smoke
      - redis-staging-failover
      - performance-validation
      - production-deployment-gate
    if: >-
      (github.event_name == 'workflow_dispatch' ||
       github.ref == 'refs/heads/main' ||
       github.ref == 'refs/heads/master') &&
      needs.build-test-container.result == 'success' &&
       needs.observability-validation.result == 'success' &&
       needs.staging-smoke.result == 'success' &&
       needs.redis-staging-failover.result == 'success' &&
       needs.performance-validation.result == 'success' &&
       needs.production-deployment-gate.result == 'success'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - name: Assert mandatory staging gate succeeded
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ needs.staging-smoke.result }}" != "success" ]; then
            echo "::error::Production is blocked because the mandatory Staging gate did not succeed."
            exit 1
          fi
          if [ "${{ needs.performance-validation.result }}" != "success" ]; then
            echo "::error::Production is blocked because concurrent performance validation did not succeed."
            exit 1
          fi
          if [ "${{ needs.production-deployment-gate.result }}" != "success" ]; then
            echo "::error::Production is blocked because database recovery validation did not succeed."
            exit 1
          fi

      - name: Trigger production deployment
        shell: bash
        env:
          PRODUCTION_DEPLOY_HOOK_URL: ${{ secrets.PRODUCTION_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail
          if [ -z "${PRODUCTION_DEPLOY_HOOK_URL:-}" ]; then
            echo "::error::PRODUCTION_DEPLOY_HOOK_URL is required."
            exit 1
          fi
          curl --fail --silent --show-error \
            --request POST \
            --max-time 30 \
            --output /dev/null \
            "${PRODUCTION_DEPLOY_HOOK_URL}"
          echo "Production deployment was triggered after successful Staging verification."
  database-recovery:
    name: Production Database Recovery Gate
    needs:
      - build-test-container
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
       (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'))
    uses: ./.github/workflows/database-restore-drill.yml
    with:
      fresh_backup: true
    secrets: inherit

  production-deployment-gate:
    name: Production Deployment Gate
    needs:
      - build-test-container
      - staging-smoke
      - database-recovery
    if: >-
      always() &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' &&
        (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')))
    runs-on: ubuntu-latest
    environment: production-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require a previous known-good Render deploy
        shell: bash
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          set -euo pipefail

          if [ -z "${RENDER_API_KEY:-}" ]; then
            echo "::error::RENDER_API_KEY is not set. Add it as a secret on the 'production-release' GitHub environment (Settings -> Environments -> production-release)."
            exit 1
          fi

          if [[ ! "${RENDER_SERVICE_ID:-}" =~ ^srv-[A-Za-z0-9]+$ ]]; then
            echo "::error::RENDER_SERVICE_ID is not set or is not in the expected 'srv-...' format. Add it as a secret on the 'production-release' GitHub environment."
            exit 1
          fi

          auth_file="$(mktemp)"
          trap 'rm -f "${auth_file}"' EXIT
          chmod 600 "${auth_file}"
          printf 'header = "Authorization: Bearer %s"\nheader = "Accept: application/json"\n' "${RENDER_API_KEY}" > "${auth_file}"

          if ! curl --fail --silent --show-error --config "${auth_file}" \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys?limit=20" > render-deploys.json; then
            echo "::error::Could not list deploys for Render service ${RENDER_SERVICE_ID}. Verify RENDER_API_KEY has access to this service and RENDER_SERVICE_ID is correct."
            exit 1
          fi

          previous_deploy_id="$(jq -r '[.. | objects | select(.status? == "live" or .status? == "deactivated") | .id? | select(. != null)] | first // empty' render-deploys.json)"

          if [ -z "${previous_deploy_id}" ]; then
            # No prior live/deactivated deploy exists yet. Treat this as the
            # first-ever production release for this service instead of
            # permanently blocking deployment (a previous "known-good" deploy
            # can never exist before the first one happens).
            echo "::warning::No previous live/deactivated Render deploy was found for ${RENDER_SERVICE_ID}. Treating this run as the first production release."
            previous_deploy_id="none-first-deploy"
          fi

          echo "PREVIOUS_KNOWN_GOOD_DEPLOY_ID=${previous_deploy_id}" >> "${GITHUB_ENV}"

      - name: Enforce successful recovery validation
        env:
          BUILD_RESULT: ${{ needs.build-test-container.result }}
          STAGING_RESULT: ${{ needs.staging-smoke.result }}
          RECOVERY_RESULT: ${{ needs.database-recovery.result }}
        run: |
          set -euo pipefail
          echo "Build gate: ${BUILD_RESULT}"
          echo "Staging gate: ${STAGING_RESULT}"
          echo "Recovery gate: ${RECOVERY_RESULT}"
          [ "${BUILD_RESULT}" = "success" ]
          [ "${STAGING_RESULT}" = "success" ]
          [ "${RECOVERY_RESULT}" = "success" ]
          echo "Production release is eligible only because actual backup restore validation passed."

      - name: Record pre-deployment recovery metadata
        shell: bash
        env:
          BACKUP_ID: ${{ needs.database-recovery.outputs.backup_id }}
          EF_CORE_MIGRATION: ${{ needs.database-recovery.outputs.ef_core_migration }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/production-release
          jq -n --arg commitSha "${GITHUB_SHA}" --arg backupId "${BACKUP_ID}" \
            --arg efCoreMigration "${EF_CORE_MIGRATION}" \
            --arg previousKnownGoodDeployId "${PREVIOUS_KNOWN_GOOD_DEPLOY_ID}" \
            --arg gateCompletedAtUtc "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{commitSha:$commitSha,backupId:$backupId,efCoreMigration:$efCoreMigration,previousKnownGoodDeployId:$previousKnownGoodDeployId,gateCompletedAtUtc:$gateCompletedAtUtc,recoveryGate:"PASS",eligibleForRenderDeploy:true}' \
            > artifacts/production-release/predeployment-recovery-metadata.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-release-recovery-metadata-${{ github.run_id }}
          retention-days: 90
          path: artifacts/production-release/*.json
