name: Supply Chain Validation

on:
  push:
    branches:
      - main
      - master
      - develop
      - 'codex/**'
      - 'feature/**'
      - 'fix/**'

  pull_request:
    branches:
      - main
      - master
      - develop

  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: supply-chain-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: 8.0.x
  SOLUTION_PATH: HudhudNestApi.sln

jobs:
  validate-source-supply-chain:
    name: Validate Source Supply Chain
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('Directory.Packages.props', 'NuGet.config', '**/*.csproj', '**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore locked dependencies
        run: |
          dotnet restore "${{ env.SOLUTION_PATH }}" --locked-mode

      - name: Restore local .NET tools
        run: |
          dotnet tool restore

      - name: Validate package governance
        shell: pwsh
        run: |
          ./scripts/validate-package-governance.ps1 `
            -RepositoryRoot $PWD.Path `
            -SolutionPath "${{ env.SOLUTION_PATH }}" `
            -PolicyPath "ci/package-policy.json" `
            -OutputDirectory "artifacts/supply-chain"

      - name: Validate GitHub Actions pinning
        run: |
          python scripts/validate-github-actions-pinning.py \
            --repository-root . \
            --output artifacts/supply-chain/action-pinning-report.json

      - name: Generate package inventory
        run: |
          mkdir -p artifacts/supply-chain
          dotnet list "${{ env.SOLUTION_PATH }}" package --include-transitive \
            > artifacts/supply-chain/package-inventory.txt

      - name: Check vulnerable packages
        shell: pwsh
        run: |
          ./ci/check-vulnerable-packages.ps1 `
            -SolutionPath "${{ env.SOLUTION_PATH }}" `
            -BaselinePath "ci/vulnerability-baseline.json" `
            -OutputDirectory "artifacts/vulnerability"

      - name: Upload supply-chain reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: supply-chain-validation-${{ github.sha }}-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 30
          path: |
            artifacts/supply-chain/**
            artifacts/vulnerability/**
