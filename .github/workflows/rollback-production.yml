name: Rollback Production Application

on:
  workflow_dispatch:
    inputs:
      target_deploy_id:
        description: Known-good Render deploy ID (dep-...)
        required: true
        type: string
      incident_id:
        description: Incident or change ticket ID
        required: true
        type: string
      approved_by:
        description: Human approver identity
        required: true
        type: string
      confirm_autodeploy_disabled:
        description: Render auto-deploy has been disabled for this incident
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: production-application-rollback
  cancel-in-progress: false

jobs:
  rollback:
    name: Protected Render Rollback
    runs-on: ubuntu-24.04
    environment: production-rollback
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A step (not a job-level if:) on purpose: a skipped rollback shows up green, and during an
      # incident that reads as "rolled back". This only guards against dispatching a stale or wrong
      # ref; the real control over who can run this with the production secrets is the
      # production-rollback environment's required reviewers and branch policy.
      - name: Require the rollback workflow to run from master
        if: ${{ github.ref != 'refs/heads/master' }}
        run: |
          echo "::error::Rollback must be dispatched from master (got ${GITHUB_REF})."
          exit 1

      - name: Require explicit rollback confirmation
        if: ${{ inputs.confirm_autodeploy_disabled != true }}
        run: |
          echo "::error::Disable Render auto-deploy and confirm the input before rollback."
          exit 1

      - name: Roll back immutable Render deploy
        shell: bash
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          # The production base URL is public, and the repository already keeps it as a *variable*
          # (the staging smoke gate reads vars.PRODUCTION_BASE_URL). Reading only secrets.* resolved to
          # an empty string, so require_env aborted every rollback. The secrets fallback keeps the
          # layout the runbook documents working.
          PRODUCTION_BASE_URL: ${{ vars.PRODUCTION_BASE_URL || secrets.PRODUCTION_BASE_URL }}
          TARGET_DEPLOY_ID: ${{ inputs.target_deploy_id }}
          INCIDENT_ID: ${{ inputs.incident_id }}
          APPROVED_BY: ${{ inputs.approved_by }}
          CONFIRM_AUTODEPLOY_DISABLED: "true"
        run: bash scripts/deployment/rollback-application.sh

      - name: Upload rollback evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-rollback-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: error
          path: artifacts/rollback-production/*.json
