name: CI - Build, Test, Validate

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

permissions:
  contents: read
  pull-requests: read

env:
  DOTNET_VERSION: '8.0.x'
  SOLUTION_PATH: 'PropertyApi.sln'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-test:
    name: Build + Test + PostGIS Migrations
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: propertyapi_testing
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d propertyapi_testing"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      ASPNETCORE_ENVIRONMENT: CI
      DOTNET_ENVIRONMENT: CI
      ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=propertyapi_testing;Username=postgres;Password=postgres;Trust Server Certificate=true
      ConnectionStrings__Redis: localhost:6379
      Redis__ConnectionString: localhost:6379
      RateLimiting__Redis__Enabled: "true"
      Jwt__Issuer: PropertyApi
      Jwt__Audience: PropertyApiClient
      Jwt__Key: TEST_ONLY_SECRET_KEY_1234567890_1234567890
      OtpSettings__SecretKey: TEST_ONLY_OTP_SECRET_KEY_1234567890_1234567890
      DataProtection__PersistKeysToDatabase: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Build
        run: |
          dotnet build ${{ env.SOLUTION_PATH }} \
            --configuration Release \
            --no-restore

      - name: Verify PostGIS and pg_trgm extensions are available
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          PGPASSWORD=postgres psql \
            -h localhost \
            -U postgres \
            -d propertyapi_testing \
            -c "CREATE EXTENSION IF NOT EXISTS postgis; CREATE EXTENSION IF NOT EXISTS pg_trgm; SELECT postgis_version();"

      - name: Apply EF Core migrations
        run: |
          dotnet run \
            --project tools/PropertyApi.Migrator/PropertyApi.Migrator.csproj \
            --configuration Release \
            --no-build

      - name: Verify migrated schema
        run: |
          PGPASSWORD=postgres psql \
            -h localhost \
            -U postgres \
            -d propertyapi_testing \
            -c 'select "MigrationId" from "__EFMigrationsHistory" order by "MigrationId" desc limit 5;'

          PGPASSWORD=postgres psql \
            -h localhost \
            -U postgres \
            -d propertyapi_testing \
            -c "select table_name from information_schema.tables where table_schema = 'public' and table_name in ('Currencies','Governorates','Districts','Neighborhoods','PropertyTypes','Transactions','PropertyReviews','VisitRequests','RentalDetails','SaleDetails','AuditLogs','DataProtectionKeys') order by table_name;"

      - name: Run all tests
        run: |
          dotnet test ${{ env.SOLUTION_PATH }} \
            --configuration Release \
            --no-build \
            --verbosity normal

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  validate-repo-hygiene:
    name: Repo Hygiene Check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check no build artifacts are tracked
        run: |
          if git ls-files | grep -E '\.(dll|pdb|exe)$'; then
            echo "ERROR: Build artifacts found in repository."
            echo "Run: git rm --cached <file> for each artifact."
            exit 1
          fi

          echo "No build artifacts tracked."

      - name: Check no runtime uploads are tracked
        run: |
          if git ls-files | grep -E 'wwwroot/(bilder|profile_fotos|uploads)/'; then
            echo "ERROR: Runtime uploads found in repository."
            exit 1
          fi

          echo "No runtime uploads tracked."

      - name: Check no environment-specific appsettings are tracked
        run: |
          if git ls-files | grep -E 'appsettings\.(Development|Production|Staging)\.json$'; then
            echo "ERROR: Environment-specific appsettings found in repository."
            exit 1
          fi

          echo "No environment-specific appsettings tracked."

      - name: Check no local Data Protection keys are tracked
        run: |
          if git ls-files | grep -E '(^|/)\.test-data-protection-keys/|(^|/)\.prod-migration-keys-temp/|DataProtection-Keys/|key-[0-9a-fA-F-]+\.xml$'; then
            echo "ERROR: Local Data Protection keys found in repository."
            echo "Remove them from Git history/commit and keep them only in runtime storage."
            exit 1
          fi

          echo "No local Data Protection keys tracked."