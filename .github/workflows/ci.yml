name: CI - Build, Test, Validate

on:
  push:
    branches:
      - main
      - master
      - develop
      - 'codex/**'
      - 'feature/**'
      - 'fix/**'

  pull_request:
    branches:
      - main
      - master
      - develop

  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: '8.0.x'
  SOLUTION_PATH: 'HudhudNestApi.sln'
  COVERAGE_BASELINE_PATH: 'ci/coverage-baseline.json'
  VULNERABILITY_BASELINE_PATH: 'ci/vulnerability-baseline.json'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-test:
    name: Build + Test + PostGIS Migrations
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    services:
      postgres:
        # Must match ci/postgres-version.env (production runs PostgreSQL 17 --
        # see that file's comment). scripts/database/check-postgres-version-consistency.sh
        # fails this workflow if this line ever drifts from that canonical value.
        image: postgis/postgis:17-3.5

        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: propertyapi_testing

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U postgres -d propertyapi_testing"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7-alpine

        ports:
          - 6379:6379

        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      ASPNETCORE_ENVIRONMENT: Testing
      DOTNET_ENVIRONMENT: Testing

      ConnectionStrings__DefaultConnection: >-
        Host=localhost;
        Port=5432;
        Database=propertyapi_testing;
        Username=postgres;
        Password=postgres

      TEST_POSTGRES_CONNECTION_STRING: >-
        Host=localhost;
        Port=5432;
        Database=propertyapi_testing;
        Username=postgres;
        Password=postgres

      ConnectionStrings__Redis: 'localhost:6379'
      Redis__ConnectionString: 'localhost:6379'

      RedisRateLimiting__ConnectionString: 'localhost:6379'
      RedisRateLimiting__Enabled: 'true'

      RateLimiting__Redis__Enabled: 'true'

      Jwt__Issuer: 'HudhudNest'
      Jwt__Audience: 'HudhudNestClient'
      Jwt__Key: 'TEST_ONLY_SECRET_KEY_1234567890_1234567890'

      OtpSettings__SecretKey: 'TEST_ONLY_OTP_SECRET_KEY_1234567890_1234567890'

      Security__PhoneLookupHmacKey: >-
        AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=

      DataProtection__PersistKeysToDatabase: 'true'

      Cloudinary__CloudName: 'ci'
      Cloudinary__ApiKey: 'ci'
      Cloudinary__ApiSecret: 'ci'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify Postgres/PostGIS version consistency (Finding F1)
        run: bash scripts/database/check-postgres-version-consistency.sh

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('Directory.Packages.props', 'NuGet.config', '**/*.csproj', '**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: |
          dotnet restore "${{ env.SOLUTION_PATH }}" --locked-mode

      - name: Restore local .NET tools
        run: |
          dotnet tool restore

      - name: Validate package governance
        shell: pwsh
        run: |
          ./scripts/validate-package-governance.ps1 `
            -RepositoryRoot $PWD.Path `
            -SolutionPath "${{ env.SOLUTION_PATH }}" `
            -PolicyPath "ci/package-policy.json" `
            -OutputDirectory "artifacts/supply-chain"

      - name: Validate GitHub Actions pinning
        run: |
          python scripts/validate-github-actions-pinning.py \
            --repository-root . \
            --output artifacts/supply-chain/action-pinning-report.json

      - name: Verify formatting
        run: |
          dotnet format "${{ env.SOLUTION_PATH }}" \
            --verify-no-changes \
            --no-restore

      - name: Check vulnerable packages
        shell: pwsh
        run: |
          ./ci/check-vulnerable-packages.ps1 `
            -SolutionPath "${{ env.SOLUTION_PATH }}" `
            -BaselinePath "${{ env.VULNERABILITY_BASELINE_PATH }}" `
            -OutputDirectory "artifacts/vulnerability"

      - name: Build solution
        run: |
          dotnet build "${{ env.SOLUTION_PATH }}" \
            --configuration Release \
            --no-restore

      - name: Install PostgreSQL and Redis clients
        run: |
          set -euo pipefail
          # postgresql-client and redis-tools both come from Ubuntu's own
          # default archive (azure.archive.ubuntu.com), never from the
          # unrelated Microsoft package repo the GH-hosted runner image
          # pre-configures for dotnet/mssql-tools. That Microsoft mirror
          # intermittently returns 403 Forbidden (observed: run 33670057946,
          # commit 9e166d460e7f6f8766ee2cd65bcc2cf2ebfb9a3c), and apt-get
          # update fails closed on ANY configured repo erroring, even one
          # this job never uses. Retry update a few times first in case it
          # is transient; if the Microsoft repo is still failing after that,
          # drop just that source list and retry once more. The subsequent
          # apt-get install still fails the job loudly (uncaught) if the
          # actually-required packages cannot be resolved, so this does not
          # mask a real failure -- it only tolerates one we do not depend on.
          for attempt in 1 2 3; do
            if sudo apt-get update; then
              break
            fi
            if [ "${attempt}" = "3" ]; then
              echo "::warning::apt-get update kept failing after 3 attempts; removing the unrelated Microsoft package repo and retrying once more." >&2
              sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list
              sudo apt-get update
            else
              echo "apt-get update failed (attempt ${attempt}/3); retrying in 5s..." >&2
              sleep 5
            fi
          done
          sudo apt-get install -y \
            postgresql-client \
            redis-tools

      - name: Verify PostgreSQL connectivity
        run: |
          PGPASSWORD=postgres psql \
            -v ON_ERROR_STOP=1 \
            -h localhost \
            -U postgres \
            -d propertyapi_testing \
            -c "SELECT version();"

      - name: Verify PostGIS and pg_trgm extensions
        run: |
          PGPASSWORD=postgres psql \
            -v ON_ERROR_STOP=1 \
            -h localhost \
            -U postgres \
            -d propertyapi_testing <<'SQL'
          CREATE EXTENSION IF NOT EXISTS postgis;
          CREATE EXTENSION IF NOT EXISTS pg_trgm;

          SELECT postgis_version();

          SELECT extname
          FROM pg_extension
          WHERE extname IN ('postgis', 'pg_trgm')
          ORDER BY extname;
          SQL

      - name: Verify Redis connectivity
        run: |
          test "$(redis-cli -h localhost -p 6379 ping)" = "PONG"

      - name: Apply EF Core migrations
        run: |
          dotnet run \
            --project tools/HudhudNestApi.Migrator/HudhudNestApi.Migrator.csproj \
            --configuration Release \
            --no-build \
            --no-restore

      - name: Verify migrated schema
        run: |
          PGPASSWORD=postgres psql \
            -v ON_ERROR_STOP=1 \
            -h localhost \
            -U postgres \
            -d propertyapi_testing <<'SQL'

          SELECT
              "MigrationId",
              "ProductVersion"
          FROM "__EFMigrationsHistory"
          ORDER BY "MigrationId" DESC
          LIMIT 5;


          DO $$
          BEGIN
              IF NOT EXISTS
              (
                  SELECT 1
                  FROM "__EFMigrationsHistory"
                  WHERE "MigrationId" =
                      '20260709114331_CutOverIdentityToApplicationUser'
              )
              THEN
                  RAISE EXCEPTION
                      'Required migration CutOverIdentityToApplicationUser is missing.';
              END IF;
          END
          $$;


          DO $$
          DECLARE
              missing_tables text;
          BEGIN
              SELECT string_agg(required_table.name, ', ')
              INTO missing_tables
              FROM
              (
                  VALUES
                      ('Currencies'),
                      ('Governorates'),
                      ('Districts'),
                      ('Neighborhoods'),
                      ('PropertyTypes'),
                      ('Transactions'),
                      ('PropertyReviews'),
                      ('VisitRequests'),
                      -- BUG-25: RentalDetails/SaleDetails were intentionally dropped by
                      -- 20260829114019_OptionBAuditCleanup (rental/sale fields moved onto
                      -- Properties directly per the "Option B" database architecture
                      -- audit) — this check was never updated after that migration
                      -- shipped, so every run failed here once restore/build could
                      -- reach this step again.
                      ('AuditLogs'),
                      ('DataProtectionKeys'),
                      ('Users'),
                      ('UserAccounts')
              ) AS required_table(name)

              LEFT JOIN information_schema.tables actual_table
                  ON actual_table.table_schema = 'public'
                 AND actual_table.table_name = required_table.name

              WHERE actual_table.table_name IS NULL;


              IF missing_tables IS NOT NULL
              THEN
                  RAISE EXCEPTION
                      'Missing required tables: %',
                      missing_tables;
              END IF;
          END
          $$;


          DO $$
          DECLARE
              legacy_user_column_count integer;
          BEGIN
              SELECT COUNT(*)
              INTO legacy_user_column_count
              FROM information_schema.columns
              WHERE table_schema = 'public'
                AND table_name = 'Users'
                AND column_name IN
                (
                    'FirstName',
                    'LastName',
                    'DisplayName',
                    'TaxNumber',
                    'ProfileImageUrl',
                    'WhatsAppNumber',
                    'PreferredLanguage',
                    'PreferredCurrency',
                    'CountryCode'
                );


              IF legacy_user_column_count <> 0
              THEN
                  RAISE EXCEPTION
                      'Users still contains % legacy profile columns.',
                      legacy_user_column_count;
              END IF;
          END
          $$;


          DO $$
          DECLARE
              missing_profile_columns text;
          BEGIN
              SELECT string_agg(required_column.name, ', ')
              INTO missing_profile_columns
              FROM
              (
                  VALUES
                      ('Id'),
                      ('FirstName'),
                      ('LastName'),
                      ('DisplayName'),
                      ('TaxNumber'),
                      ('ProfileImageUrl'),
                      ('WhatsAppNumber'),
                      ('PreferredLanguage'),
                      ('PreferredCurrency'),
                      ('CountryCode'),
                      ('CreatedAt'),
                      ('UpdatedAt')
              ) AS required_column(name)

              LEFT JOIN information_schema.columns actual_column
                  ON actual_column.table_schema = 'public'
                 AND actual_column.table_name = 'UserAccounts'
                 AND actual_column.column_name = required_column.name

              WHERE actual_column.column_name IS NULL;


              IF missing_profile_columns IS NOT NULL
              THEN
                  RAISE EXCEPTION
                      'UserAccounts is missing required columns: %',
                      missing_profile_columns;
              END IF;
          END
          $$;

          SQL

      # A "failing tests block the merge" guarantee is only as good as the set of
      # tests that actually run. dotnet test already fails the job on a red test
      # (no continue-on-error anywhere in this workflow), but a test project that
      # is never invoked can go red indefinitely without anyone noticing. This step
      # fails when a project under tests/ is neither run below nor explicitly
      # delegated to another workflow, so adding a new suite forces that decision.
      - name: Every test project must have an owner
        shell: bash
        run: |
          set -euo pipefail

          owned="
          HudhudNestApi.Application.Tests|this job
          HudhudNestApi.Auth.Tests|this job
          HudhudNestApi.Integration.Tests|this job
          HudhudNestApi.Architecture.Tests|this job
          HudhudNestApi.Infrastructure.Tests|this job
          HudhudNestApi.Observability.Tests|this job
          HudhudNestApi.Concurrency.Tests|performance-validation.yml
          HudhudNestApi.Performance.Tests|performance-validation.yml
          HudhudNestApi.StagingSmokeTests|runs against a deployed Staging environment
          "

          missing=""
          for project in tests/*/*.csproj; do
            suite="$(basename "$(dirname "$project")")"
            owner="$(printf '%s\n' "$owned" | grep "^${suite}|" | cut -d'|' -f2 || true)"

            if [ -z "$owner" ]; then
              missing="$missing $suite"
            else
              echo "  $suite -> $owner"
            fi
          done

          if [ -n "$missing" ]; then
            echo "::error::Test projects with no owning workflow:$missing"
            echo "Run them in this job, or record which workflow owns them in this step."
            exit 1
          fi

          echo "All test projects are accounted for."

      - name: Run Application tests
        run: >
          dotnet test
          tests/HudhudNestApi.Application.Tests/HudhudNestApi.Application.Tests.csproj
          --configuration Release
          --no-build
          --no-restore
          --collect:"XPlat Code Coverage"
          --results-directory artifacts/test-results/application
          --logger "console;verbosity=minimal"
          --logger "trx;LogFileName=application-tests.trx"

      - name: Reset Redis before Auth tests
        run: |
          redis-cli \
            -h localhost \
            -p 6379 \
            FLUSHALL

      - name: Run Auth tests
        run: >
          dotnet test
          tests/HudhudNestApi.Auth.Tests/HudhudNestApi.Auth.Tests.csproj
          --configuration Release
          --no-build
          --no-restore
          --collect:"XPlat Code Coverage"
          --results-directory artifacts/test-results/auth
          --logger "console;verbosity=minimal"
          --logger "trx;LogFileName=auth-tests.trx"

      - name: Reset Redis before Integration tests
        run: |
          redis-cli \
            -h localhost \
            -p 6379 \
            FLUSHALL

      - name: Run Integration tests
        run: >
          dotnet test
          tests/HudhudNestApi.Integration.Tests/HudhudNestApi.Integration.Tests.csproj
          --configuration Release
          --no-build
          --no-restore
          --collect:"XPlat Code Coverage"
          --results-directory artifacts/test-results/integration
          --logger "console;verbosity=minimal"
          --logger "trx;LogFileName=integration-tests.trx"

      - name: Run Architecture tests
        run: >
          dotnet test
          tests/HudhudNestApi.Architecture.Tests/HudhudNestApi.Architecture.Tests.csproj
          --configuration Release
          --no-build
          --no-restore
          --collect:"XPlat Code Coverage"
          --results-directory artifacts/test-results/architecture
          --logger "console;verbosity=minimal"
          --logger "trx;LogFileName=architecture-tests.trx"

      # BUG (found via CI run #427/PR #134 investigation, 2026-09-12): this suite
      # was added to tests/ (SocialPublisherAdapterTests etc.) but never wired
      # into any workflow's `dotnet test` step, so "Every test project must have
      # an owner" below always failed once it was reachable -- previously masked
      # because "Verify formatting" failed first on every run. No DB/Redis
      # dependency (pure unit tests over Domain/Application/Infrastructure with
      # Moq), so it needs no service containers, same as Architecture tests.
      - name: Run Infrastructure tests
        run: >
          dotnet test
          tests/HudhudNestApi.Infrastructure.Tests/HudhudNestApi.Infrastructure.Tests.csproj
          --configuration Release
          --no-build
          --no-restore
          --collect:"XPlat Code Coverage"
          --results-directory artifacts/test-results/infrastructure
          --logger "console;verbosity=minimal"
          --logger "trx;LogFileName=infrastructure-tests.trx"

      # observability-validation.yml also runs these, but it is path-filtered to
      # HudhudNestApi/Observability/** and observability/**. A change anywhere else
      # that breaks them would not trigger it, so they run here unconditionally too.
      - name: Run Observability tests
        run: >
          dotnet test
          tests/HudhudNestApi.Observability.Tests/HudhudNestApi.Observability.Tests.csproj
          --configuration Release
          --no-build
          --no-restore
          --collect:"XPlat Code Coverage"
          --results-directory artifacts/test-results/observability
          --logger "console;verbosity=minimal"
          --logger "trx;LogFileName=observability-tests.trx"

      # if: always() so the .trx-based gate still reports when an earlier suite
      # failed. The job is already red at that point; this makes the summary say
      # which suite and how many tests, instead of stopping at the first failure.
      - name: Validate test result files
        if: always()
        shell: pwsh
        run: |
          ./scripts/validate-test-results.ps1 `
            -TestResultsRoot "artifacts/test-results" `
            -OutputDirectory "artifacts/supply-chain"

      - name: Check coverage baseline
        shell: pwsh
        run: |
          ./ci/check-coverage-baseline.ps1 `
            -CoverageRoot "artifacts/test-results" `
            -BaselinePath "${{ env.COVERAGE_BASELINE_PATH }}" `
            -OutputDirectory "artifacts/coverage"

      - name: Validate staged coverage thresholds
        run: |
          python scripts/validate-coverage-thresholds.py \
            --repository-root . \
            --coverage-root artifacts/test-results \
            --policy ci/coverage-thresholds.json \
            --output-directory artifacts/coverage

      - name: Generate coverage report
        run: |
          dotnet tool run reportgenerator -- \
            -reports:"artifacts/test-results/**/coverage.cobertura.xml" \
            -targetdir:"artifacts/coverage/report" \
            -reporttypes:"HtmlInline;Cobertura;MarkdownSummaryGithub"

          if [ -f artifacts/coverage/report/SummaryGithub.md ]; then
            cat artifacts/coverage/report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload CI reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-quality-gate-reports-${{ github.sha }}-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            artifacts/test-results/**
            artifacts/coverage/**
            artifacts/vulnerability/**
            artifacts/supply-chain/**


  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  validate-repo-hygiene:
    name: Repo Hygiene Check
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check no build artifacts are tracked
        run: |
          if git ls-files | grep -E '\.(dll|pdb|exe)$'; then
            echo "ERROR: Build artifacts found in repository."
            echo "Run: git rm --cached <file> for each artifact."
            exit 1
          fi

          echo "No build artifacts tracked."

      - name: Check no runtime uploads are tracked
        run: |
          if git ls-files | grep -E 'wwwroot/(bilder|profile_fotos|uploads)/'; then
            echo "ERROR: Runtime uploads found in repository."
            exit 1
          fi

          echo "No runtime uploads tracked."

      - name: Check no environment-specific appsettings are tracked
        run: |
          if git ls-files |
             grep -E 'appsettings\.(Development|Production|Staging)\.json$'
          then
            echo "ERROR: Environment-specific appsettings found in repository."
            exit 1
          fi

          echo "No environment-specific appsettings tracked."

      - name: Check no local Data Protection keys are tracked
        run: |
          if git ls-files |
             grep -E '(^|/)\.test-data-protection-keys/|(^|/)\.prod-migration-keys-temp/|DataProtection-Keys/|key-[0-9a-fA-F-]+\.xml$'
          then
            echo "ERROR: Local Data Protection keys found in repository."
            echo "Remove them from Git history/commit and keep them only in runtime storage."
            exit 1
          fi

          echo "No local Data Protection keys tracked."
