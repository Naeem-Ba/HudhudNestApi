name: Concurrent Performance Validation

on:
  pull_request:
    branches: [main, master, develop]
  push:
    branches: [main, master]
  schedule:
    - cron: '17 2 * * 1'
  workflow_dispatch:
    inputs:
      profile:
        description: Performance profile
        type: choice
        options: [pr, release, staging]
        default: pr
  workflow_call:
    inputs:
      profile:
        description: Performance profile
        required: false
        type: string
        default: release

permissions:
  contents: read

concurrency:
  group: performance-${{ github.workflow }}-${{ github.ref }}-${{ inputs.profile || github.event_name }}
  cancel-in-progress: false

jobs:
  performance-validation:
    name: Two replicas + k6 + PostgreSQL analysis
    # BUG-33: the `release` and `staging` profiles run api1 + api2 + postgres +
    # redis + k6 all concurrently under real load (25k/100k-row datasets,
    # up to 30 VUs). Evidence from Production Gate #215
    # (container-resources-timeseries.jsonl in that run's performance
    # artifact) showed postgres peaking at 182.82% CPU -- full saturation of
    # a standard 2-vCPU GitHub-hosted runner, with api1/api2 concurrently at
    # 91-93% each -- causing browse-cold/browse-warm to miss their p95/p99/RPS
    # budgets even though query plans stayed clean (EXPLAIN ANALYZE gate
    # passed) and the identical commit tree passed cleanly minutes earlier
    # under the lighter `pr` profile. That's CPU oversubscription on the
    # runner, not a code or query regression -- see BUG-30b below for the
    # earlier, insufficient mitigation (VU tuning alone) of the same
    # signature. `pr` profile stays on a standard runner since it has not
    # shown this signature (BUG-30b evidence and this run were both
    # release/staging only).
    #
    # Requires "Larger runners" to be provisioned for this repository/org
    # (Settings -> Actions -> Runners -> Larger runners; needs GitHub Team or
    # Enterprise Cloud -- NOT available at all for a personal-account repo,
    # which is what this repo currently is). Falls back to ubuntu-latest if
    # unset via workflow_dispatch/workflow_call with an unrecognized profile.
    #
    # BUG (found via Production Gate run #235 / CI run #427 investigation,
    # 2026-09-12): this job unconditionally requested the `ubuntu-latest-4-cores`
    # label for release/staging profiles even though this repo has never had
    # Larger runners provisioned (confirmed: owner account type is "User", and
    # Larger runners require an organization on GitHub Team/Enterprise Cloud --
    # they cannot be provisioned for a personal account at any plan tier).
    # GitHub queues a job requesting a runner label that will never exist
    # indefinitely instead of failing it, and because production-gate.yml sets
    # `concurrency: cancel-in-progress: false` per ref, every subsequent push
    # to master queued behind the stuck run too -- e.g. run 34673319511 sat
    # "queued" for 7h36m+ with every other job in it already completed, and
    # the very next push's Production Gate run (235) never started at all.
    # Gate the larger-runner request behind an explicit repository variable
    # so the safe default (ubuntu-latest, which always schedules) is what
    # runs until the repository owner actually provisions Larger runners and
    # opts in.
    runs-on: >-
      ${{
        (vars.PERFORMANCE_LARGER_RUNNERS_ENABLED == 'true' &&
         (inputs.profile == 'release' || inputs.profile == 'staging'))
        && 'ubuntu-latest-4-cores'
        || 'ubuntu-latest'
      }}
    timeout-minutes: 180
    env:
      PERF_ENVIRONMENT: CI
      PERF_PROFILE: ${{ inputs.profile || (github.event_name == 'schedule' && 'staging') || ((github.event_name == 'pull_request' || github.event_name == 'push') && 'pr') || 'release' }}
      PERF_COMMIT_SHA: ${{ github.sha }}
      PERF_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
      PERF_BASE_URL: http://localhost:58080
      PRODUCTION_BASE_URL: https://production.invalid

    steps:
      - name: Checkout intended release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x

      - name: Install PostgreSQL client
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-client jq

      - name: Restore performance projects
        run: |
          set -euo pipefail
          dotnet restore PropertyApi.sln

      - name: Build performance validation system
        run: |
          set -euo pipefail
          dotnet build PropertyApi.sln --configuration Release --no-restore

      - name: Run performance configuration regression tests
        run: |
          set -euo pipefail
          dotnet test tests/PropertyApi.Performance.Tests/PropertyApi.Performance.Tests.csproj \
            --configuration Release --no-build --no-restore
          dotnet test tests/PropertyApi.Concurrency.Tests/PropertyApi.Concurrency.Tests.csproj \
            --configuration Release --no-build --no-restore

      - name: Run mandatory concurrent performance and query gate
        run: |
          set -euo pipefail
          chmod +x scripts/run-performance-tests.sh \
            scripts/capture-query-plans.sh \
            scripts/capture-pg-stat-statements.sh \
            scripts/capture-auth-race-integrity.sh \
            scripts/compare-performance-baseline.sh
          bash scripts/run-performance-tests.sh

      - name: Publish performance summary
        if: always()
        run: |
          if [ -f artifacts/performance/summary.md ]; then
            cat artifacts/performance/summary.md >> "${GITHUB_STEP_SUMMARY}"
          else
            echo '## Performance validation failed before summary generation' >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload sanitized performance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: performance-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30
          path: |
            artifacts/performance/summary.json
            artifacts/performance/summary.md
            artifacts/performance/junit.xml
            artifacts/performance/thresholds.json
            artifacts/performance/environment.json
            artifacts/performance/dataset-manifest.json
            artifacts/performance/endpoint-results.csv
            artifacts/performance/concurrency/**
            artifacts/performance/database-results.json
            artifacts/performance/query-plan-analysis.json
            artifacts/performance/query-plans/**
            artifacts/performance/postgresql/**
            artifacts/performance/k6/**
            artifacts/performance/baseline-comparison.json
            artifacts/performance/service-logs.txt
            artifacts/performance/container-resources.jsonl
            artifacts/performance/container-resources-timeseries.jsonl
            artifacts/performance/redis-memory.txt
