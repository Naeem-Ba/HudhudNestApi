groups:
  - name: property-api-slos
    interval: 30s
    rules:
      - record: propertyapi:sli_availability:ratio_rate5m
        expr: 1 - (sum(rate(http_server_request_duration_seconds_count{service_name="property-api",http_response_status_code=~"5.."}[5m])) / clamp_min(sum(rate(http_server_request_duration_seconds_count{service_name="property-api"}[5m])), 0.001))
      - record: propertyapi:sli_latency_500ms:ratio_rate5m
        expr: sum(rate(http_server_request_duration_seconds_bucket{service_name="property-api",le="0.5"}[5m])) / clamp_min(sum(rate(http_server_request_duration_seconds_count{service_name="property-api"}[5m])), 0.001)
      - record: propertyapi:sli_auth_success:ratio_rate5m
        expr: 1 - (sum(rate(propertyapi_auth_requests_total{outcome!="success"}[5m])) / clamp_min(sum(rate(propertyapi_auth_requests_total[5m])), 0.001))
      - record: propertyapi:slo_availability:error_budget_remaining
        expr: clamp_max(clamp_min((propertyapi:sli_availability:ratio_rate5m - 0.995) / 0.005, 1), 0)
