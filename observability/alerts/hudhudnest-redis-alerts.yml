groups:
  - name: hudhudnest-redis
    rules:
      - alert: HudhudNestApiRedisHighTimeoutRate
        expr: increase(redis_timeouts_total[5m]) > 10
        for: 5m
        labels:
          severity: warning
          service: propertyapi
        annotations:
          summary: Redis timeout rate is elevated.
          description: Redis command timeouts exceeded the accepted threshold for HudhudNestApi.

      - alert: HudhudNestApiRedisReconnectStorm
        expr: increase(redis_reconnects_total[5m]) > 5
        for: 5m
        labels:
          severity: warning
          service: propertyapi
        annotations:
          summary: Redis reconnects are elevated.
          description: Application Redis clients are reconnecting frequently; check failover or network stability.

      - alert: HudhudNestApiRedisFeatureDegraded
        expr: increase(propertyapi_redis_feature_degraded_total[5m]) > 0
        for: 2m
        labels:
          severity: warning
          service: propertyapi
        annotations:
          summary: A Redis-dependent feature is degraded.
          description: Inspect feature label and verify degradation matches the failure policy.

      - alert: HudhudNestApiRateLimiterFailClosed
        expr: increase(propertyapi_rate_limiter_fail_closed_total[5m]) > 0
        for: 1m
        labels:
          severity: critical
          service: propertyapi
        annotations:
          summary: Security-sensitive rate limiting failed closed.
          description: Authentication or OTP traffic may be blocked because Redis-backed abuse protection is unavailable.

      - alert: HudhudNestApiRedisReplicationLag
        expr: redis_replica_lag_seconds > 10
        for: 5m
        labels:
          severity: warning
          service: propertyapi
        annotations:
          summary: Redis replica lag is above target.
          description: Replica lag may increase data loss or failover recovery risk.

      - alert: HudhudNestApiRedisPrimaryRoleChanged
        expr: increase(redis_primary_role_changes_total[10m]) > 0
        for: 0m
        labels:
          severity: info
          service: propertyapi
        annotations:
          summary: Redis primary role changed.
          description: Validate application reconnect, fallback metrics, and post-failover recovery checks.
