# Prometheus config for the real Staging deployment on Render.
#
# No scrape_configs: unlike the local docker-compose setup (which pulls from otel-collector
# over the private Docker network), this Prometheus receives metrics purely via remote-write
# pushes from the Staging otel-collector over a public HTTPS call -- Render's free plan
# services can't accept private-network traffic, and Prometheus has no way to reach into
# another free service on a non-public port to scrape it. See the Dockerfile for how
# --web.enable-remote-write-receiver is enabled.
global:
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules/*.yml
