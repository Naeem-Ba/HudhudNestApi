# Tempo config for the real Staging deployment on Render.
#
# Uses the OTLP-HTTP receiver (not gRPC, unlike the local docker-compose config) to match the
# Staging otel-collector's otlphttp exporter -- HTTP is the protocol confirmed safe to cross
# Render's ingress. Both this receiver (4318) and Tempo's own query API (server.http_listen_port,
# 3200) stay bound to localhost only; nginx (started alongside Tempo in this same container,
# see Dockerfile/docker-entrypoint.sh) is what Render actually exposes on the single public
# port, and multiplexes /v1/traces to 4318 and everything else to 3200 -- Tempo's ingest and
# query roles need genuinely separate ports and Render allows only one public port per service.
server:
  http_listen_address: 127.0.0.1
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 127.0.0.1:4318

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 24h

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks
