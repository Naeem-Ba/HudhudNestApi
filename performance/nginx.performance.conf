events {
  worker_connections 2048;
}

http {
    map $http_x_performance_client_ip $performance_client_ip {
        default $remote_addr;
        "~^198\.18\.0\.[0-9]{1,3}$" $http_x_performance_client_ip;
    }

  server {
    listen 8080;
    server_name _;

    location / {
      # A static proxy_pass to the named upstream block below uses nginx's
      # normal upstream load balancing (least_conn + failover), resolving
      # api1/api2 once when workers start. This is safe here because
      # load-balancer only starts after the wait-for-apis service has
      # already confirmed both are answering on /health/ready, so their
      # hostnames are guaranteed resolvable via Docker's embedded DNS by
      # the time nginx starts.
      #
      # Do NOT route this through a variable (e.g. `set $upstream ...;
      # proxy_pass $upstream;`): a variable target makes nginx treat the
      # value as a literal hostname to resolve via the `resolver`
      # directive, not as a reference to the upstream block below.
      # "propertyapi_upstream" is not a real DNS name, so that resolution
      # always failed with a 502 — which made every request (including
      # this location's own healthcheck) fail, and the container was
      # marked permanently unhealthy.
      proxy_pass http://propertyapi_upstream;

      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $performance_client_ip;

      proxy_connect_timeout 5s;
      proxy_read_timeout 65s;

      # If api1/api2 refuses the connection, times out, or returns 5xx,
      # retry against the other upstream server instead of failing the request.
      proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
      proxy_next_upstream_tries 3;
      proxy_next_upstream_timeout 10s;
    }
  }

  upstream propertyapi_upstream {
    least_conn;
    server api1:8080 max_fails=2 fail_timeout=3s;
    server api2:8080 max_fails=2 fail_timeout=3s;
    keepalive 64;
  }
}