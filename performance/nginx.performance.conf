events {
  worker_connections 2048;
}

http {
    map $http_x_performance_client_ip $performance_client_ip {
        default $remote_addr;
        "~^198\.18\.0\.[0-9]{1,3}$" $http_x_performance_client_ip;
    }

  # Docker's embedded DNS resolver — forces nginx to re-resolve
  # api1/api2 at request time instead of caching (or failing) at startup.
  resolver 127.0.0.11 valid=5s ipv6=off;

  server {
    listen 8080;
    server_name _;

    location / {
      # Using a variable + resolver above means nginx resolves this
      # per-request rather than once at startup, so a container that
      # wasn't ready yet at boot is picked up as soon as it becomes reachable.
      set $upstream_property_api "http://propertyapi_upstream";
      proxy_pass $upstream_property_api;

      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $performance_client_ip;

      proxy_connect_timeout 5s;
      proxy_read_timeout 65s;

      # If api1/api2 refuses the connection, times out, or returns 5xx,
      # retry against the other upstream server instead of failing the request.
      proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
      proxy_next_upstream_tries 3;
      proxy_next_upstream_timeout 10s;
    }
  }

  upstream propertyapi_upstream {
    least_conn;
    server api1:8080 max_fails=2 fail_timeout=3s;
    server api2:8080 max_fails=2 fail_timeout=3s;
    keepalive 64;
  }
}