events {
  worker_connections 2048;
}

http {
    map $http_x_performance_client_ip $performance_client_ip {
        default $remote_addr;
        "~^198\.18\.0\.[0-9]{1,3}$" $http_x_performance_client_ip;
    }

  upstream property_api {
    least_conn;
    server api1:8080;
    server api2:8080;
    keepalive 64;
  }

  server {
    listen 8080;
    server_name _;

    location / {
      proxy_pass http://property_api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $performance_client_ip;
      proxy_connect_timeout 5s;
      proxy_read_timeout 65s;
    }
  }
}
