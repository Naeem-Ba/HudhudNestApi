# Redis Sentinel configuration for the Production Gate's self-hosted Redis HA
# topology (see docs/REDIS-HA.md). Identical content is loaded into all three
# sentinel-1/2/3 containers -- Sentinels do not need to be told about each
# other by name; they discover peer Sentinels automatically via Pub/Sub
# through the monitored master, so one shared template is correct and is the
# reusable, maintainable source of truth referenced by
# ci/docker-compose.production-gate.yml.
#
# Each container copies this read-only template into its own writable path
# at startup (see the `command:` override on redis-sentinel-1/2/3) because
# Sentinel rewrites its config file in place as it discovers topology state;
# writing back onto a shared bind-mounted file would race across the three
# containers.

port 26379

# --- Addressing: static IPs, not Docker DNS hostnames -----------------
# `sentinel resolve-hostnames yes` was tried first and rejected by a real
# local failover drill: once `docker compose stop redis-primary` stops the
# container, Docker's embedded DNS stops resolving the `redis-primary`
# hostname entirely (confirmed with `getent hosts redis-primary` -> exit 2
# while the container was stopped). Sentinel then logs
# "Failed to resolve hostname 'redis-primary'" and re-enters TILT mode on
# every single monitoring cycle, which suppresses failover indefinitely --
# the topology never promotes the replica. This is exactly the kind of
# "container exited" != "HA proven" false positive this drill exists to
# rule out (see docs/REDIS-HA.md).
#
# Fixing it: ci/docker-compose.production-gate.yml assigns each of these
# five services a fixed IP on the `redis-ha` network's 172.28.0.0/24
# subnet. Sentinel then never needs to resolve anything -- it learns the
# replica's IP directly from the primary's own `INFO replication` output,
# exactly as it would against a provider's real Sentinel-fronted topology
# that also addresses nodes by IP.
sentinel monitor mymaster 172.28.0.10 6379 2

# CI-appropriate timing: fast enough that a full HA drill (detect failure,
# elect, promote, resync) finishes in well under a minute, but not so fast
# that normal container scheduling jitter on a shared CI runner produces a
# false-positive failure detection.
sentinel down-after-milliseconds mymaster 5000
sentinel failover-timeout mymaster 10000
sentinel parallel-syncs mymaster 1

# Test-only network posture: this topology is never published to the host
# (no `ports:` mapping in docker-compose.production-gate.yml) and only lives
# on the internal `redis-ha` Compose network for the lifetime of the
# Production Gate job, so binding all interfaces with protected-mode off is
# scoped to that isolated network, not the public internet. Do not reuse
# this file outside of CI. See docs/REDIS-HA.md "Security Review".
bind 0.0.0.0
protected-mode no
